 const a=Array.isArray(old?.answers)?old.answers:[];
 const answers=qs.map((q,i)=>{const x=a[i];return x&&Array.isArray(x.pair)&&typeof x.relation==='string'?{pair:x.pair.filter(y=>Number.isInteger(y)&&y>=0&&y<4).slice(0,2),relation:['S','A'].includes(x.relation)?x.relation:''}:{pair:[],relation:''};});
 const rev=old?.review||{};
 const ok=['','correct','attention','unanswered'];
 return {answers,review:{checksUsed:validInt(rev.checksUsed),extraChecksGranted:validInt(rev.extraChecksGranted),
  statuses:Array.isArray(rev.statuses)&&rev.statuses.length===qs.length?rev.statuses.map(s=>ok.includes(s)?s:''):qs.map(()=>''),
  revised:Array.isArray(rev.revised)&&rev.revised.length===qs.length?rev.revised.map(Boolean):qs.map(()=>false)}};}
let state=initState();
const allowedChecks=()=>MAX_CHECKS+state.review.extraChecksGranted;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));$('saveStatus').textContent='Saved on this device';}catch(e){$('saveStatus').textContent='Autosave unavailable · Export / Print keeps a copy';}}
let speechTimeout;
function cancelSpeak(){clearTimeout(speechTimeout);try{speechSynthesis.cancel();}catch(e){}$('speakingToast').classList.remove('show');}
function speak(text){if(!text)return;cancelSpeak();if(!('speechSynthesis' in window))return;
 const u=new SpeechSynthesisUtterance(String(text));u.rate=.88;u.pitch=1.05;u.lang='en-US';
 u.onend=u.onerror=()=>{$('speakingToast').classList.remove('show');};$('speakingToast').classList.add('show');
 speechTimeout=setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){$('speakingToast').classList.remove('show');}},30);}
const posName={n:'noun',v:'verb',adj:'adjective',adv:'adverb'};
const posAbbr={noun:'n',verb:'v',adjective:'adj',adverb:'adv'};
function tag(pos){return '<span class="pos pos-'+esc(pos)+'">'+esc(posAbbr[pos]||pos)+'</span>';}
function renderBank(container){container.innerHTML='';for(const item of D.words){const pos=[...new Set(item.senses.map(s=>s[1]))];const b=elem('button','bank-word');b.type='button';b.setAttribute('aria-label','Definition of '+item.word);b.innerHTML='<span>'+esc(item.word)+'</span>'+pos.map(tag).join('');b.addEventListener('click',()=>openDefinition(item.word));container.append(b);}}
function isLessonWord(word){const w=String(word||'').toLowerCase();return Object.prototype.hasOwnProperty.call(D.vocabForms,w);}
function openDefinition(word){const w=String(word||'').toLowerCase();
 const root=Object.prototype.hasOwnProperty.call(D.vocabForms,w)?D.vocabForms[w]:w;
 const packetItem=D.words.find(e=>e.word===root);
 const outside=Object.prototype.hasOwnProperty.call(D.referenceWords,w)?D.referenceWords[w]:null;
 const item=packetItem||(outside?{word:w,senses:outside.senses}:null);if(!item){speak(word);return;}
 const dlg=$('definitionDialog'),rootEl=$('definitionBody');$('definitionTitle').textContent=item.word;rootEl.innerHTML='';
 let anyWritten=false;
 for(const sense of item.senses){const [label,pos,definition,example,written]=sense;if(written)anyWritten=true;
  const wrap=elem('div','definition-card');const play=elem('button','definition-play','▶');play.type='button';play.setAttribute('aria-label','Read definition and example aloud');
  play.onclick=()=>speak(label+'. '+pos+'. Definition: '+definition+' Example: '+example);
  const box=elem('div');box.innerHTML='<div class="definition-label">'+esc(label)+' '+tag(pos)+'</div><div class="definition-row"><div class="definition-kind">Definition</div><div class="definition-text">'+esc(definition)+'</div></div><div class="definition-row"><div class="definition-kind example">Example'+(written?' ✎':'')+'</div><div class="definition-text example">'+esc(example)+'</div></div>';
  wrap.append(play,box);rootEl.append(wrap);}
 const source=elem('p','definition-source');
 if(packetItem){source.textContent='Source: Wordly Wise 3000, Book 6 · Word List 9 (packet)';}
 else{const link=elem('a','',outside.sourceLabel);link.href=outside.sourceUrl;link.target='_blank';link.rel='noopener noreferrer';source.append('Definition: ',link,' (CC BY-SA 3.0).'+(anyWritten?' ✎ Examples marked ✎ were written for this worksheet.':''));}
 rootEl.append(source);cancelSpeak();if(!dlg.open)dlg.showModal();}
function isAnswered(i){const a=state.answers[i];return a.pair.length===2&&['S','A'].includes(a.relation);}
function isCorrect(i){const q=qs[i],a=state.answers[i];return a.pair.length===2&&q.pair.every(v=>a.pair.includes(v))&&a.relation===q.relation;}
function allVerifiedCorrect(){return state.review.statuses.length===qs.length&&state.review.statuses.every(s=>s==='correct')&&state.review.revised.every(r=>!r);}
function markChanged(i){if(state.review.checksUsed>0){state.review.statuses[i]='';state.review.revised[i]=true;}hideIncompleteWarning();save();paintStatus(i);updateProgress();}
function setAnswer(i,value,focusKey){state.answers[i]=value;markChanged(i);renderCard(i,focusKey);}
function paintStatus(i){const node=$('q'+i);if(!node)return;const wrap=node.querySelector('.review-status');if(!wrap)return;const s=state.review.statuses[i];
 node.classList.toggle('answered',isAnswered(i));node.classList.toggle('is-correct',s==='correct');node.classList.toggle('needs-review',s==='attention');node.classList.toggle('unanswered-review',s==='unanswered');
 wrap.innerHTML='';let label='';
 if(s==='correct')label='✅ Correct';else if(s==='attention')label='💡 Needs another look. '+(qs[i].hint||'Think about the word meanings.');else if(s==='unanswered')label='○ Unanswered';else if(state.review.revised[i])label='✎ Changed since your last check';
 if(!label)return;wrap.append(elem('span','',label));
 const play=elem('button','status-listen','🔊');play.type='button';play.setAttribute('aria-label','Read review note');play.onclick=()=>speak(label);wrap.append(play);}
function pipState(i){const s=state.review.statuses[i];if(s==='correct'&&!state.review.revised[i])return 'correct';if(s==='attention'&&!state.review.revised[i])return 'attention';return isAnswered(i)?'answered':'';}
function updateProgress(){const count=qs.filter((_,i)=>isAnswered(i)).length;$('progressText').textContent=count+' of '+qs.length+' answered';
 $('progressPips').querySelectorAll('.pip').forEach((e,i)=>{const st=pipState(i);e.className='pip'+(st?' '+st:'');const txt='Question '+(i+1)+': '+({correct:'checked, correct',attention:'checked, needs another look',answered:'answered, not yet checked','':'not finished'})[st];e.title=txt;e.setAttribute('aria-label',txt);});
 paintCheckPanel();}
function paintCheckPanel(){const used=state.review.checksUsed,allowed=allowedChecks();const finished=allVerifiedCorrect(),exhausted=used>=allowed,remaining=Math.max(0,allowed-used);
 $('checkBtn').disabled=finished||exhausted;$('adultUnlockButton').hidden=finished||!exhausted;
 $('checksRemaining').textContent=finished?'All responses verified. ✅':exhausted?'All checks used · you may still edit and export.':remaining+' check'+(remaining===1?'':'s')+' remaining';
 if(finished||!exhausted)cancelAdultUnlock();}
function showWarning(missing){$('incompleteWarning').classList.add('show');$('incompleteText').textContent='Question'+(missing.length>1?'s ':' ')+missing.map(i=>i+1).join(', ')+(missing.length>1?' are':' is')+' not finished. Checking anyway will use one check.';}
function hideIncompleteWarning(){$('incompleteWarning').classList.remove('show');}
function requestCheck(){if(state.review.checksUsed>=allowedChecks()||allVerifiedCorrect())return;const missing=qs.map((q,i)=>i).filter(i=>!isAnswered(i));if(missing.length){showWarning(missing);return;}checkAll();}
function checkAll(){if(state.review.checksUsed>=allowedChecks()||allVerifiedCorrect())return;state.review.checksUsed++;state.review.statuses=qs.map((q,i)=>!isAnswered(i)?'unanswered':isCorrect(i)?'correct':'attention');state.review.revised=qs.map(()=>false);hideIncompleteWarning();save();qs.forEach((q,i)=>paintStatus(i));updateProgress();}
function openAdultUnlock(){if(state.review.checksUsed<allowedChecks()||allVerifiedCorrect())return;const input=$('adultCheckCode');$('adultUnlockMessage').textContent='';input.value='';$('adultUnlockPanel').hidden=false;$('adultUnlockButton').setAttribute('aria-expanded','true');input.focus();}
function cancelAdultUnlock(){$('adultUnlockPanel').hidden=true;$('adultCheckCode').value='';$('adultUnlockMessage').textContent='';$('adultUnlockButton').setAttribute('aria-expanded','false');}
function grantOneMoreCheck(){if(state.review.checksUsed<allowedChecks()||allVerifiedCorrect())return;const input=$('adultCheckCode');
 if(input.value!==ADULT_UNLOCK_CODE){$('adultUnlockMessage').textContent='Code not recognized.';input.value='';input.focus();return;}
 state.review.extraChecksGranted++;cancelAdultUnlock();save();paintCheckPanel();}
function resetAll(){const b=$('clearBtn');if(b.dataset.confirm!=='yes'){b.dataset.confirm='yes';b.textContent='⚠️ Tap again to clear everything';setTimeout(()=>{if(b.dataset.confirm==='yes'){b.dataset.confirm='';b.textContent='🗑️ Clear all responses';}},4000);return;}cancelSpeak();try{localStorage.removeItem(storageKey);}catch(e){}location.reload();}
function renderCard(i,focusKey){const target=$('q'+i);if(!target)return;const fresh=buildCard(i);target.replaceWith(fresh);paintStatus(i);updateProgress();if(focusKey){const f=fresh.querySelector('[data-f="'+focusKey+'"]');if(f)f.focus();}}
function buildCard(i){const q=qs[i],a=state.answers[i];
 const card=elem('article','question-card');card.id='q'+i;const top=elem('div','card-top');top.append(elem('div','qnum',String(i+1)));const body=elem('div','card-body');top.append(body);card.append(top);
 const opts=elem('div','choices');
 q.words.forEach((word,j)=>{const row=elem('div','choice-row'),selected=a.pair.includes(j),atLimit=a.pair.length===2&&!selected;
  const check=elem('button','choose-btn'+(selected?' selected':'')+(atLimit?' at-limit':''),selected?'☑':'☐');check.type='button';check.dataset.f='c'+j;
  check.setAttribute('aria-pressed',String(selected));check.setAttribute('aria-label',(selected?'Deselect ':'Select ')+word+' and hear the word');
  if(atLimit)check.title='Two words chosen: tap to hear this word, or deselect one before choosing another.';
  check.onclick=()=>{speak(word);if(atLimit)return;const pair=selected?a.pair.filter(x=>x!==j):[...a.pair,j];setAnswer(i,{pair,relation:a.relation},'c'+j);};
  const lesson=isLessonWord(word);
  const label=elem('button','choice-read'+(lesson?' lesson-vocab':''),word);label.type='button';label.setAttribute('aria-haspopup','dialog');label.setAttribute('aria-label','Open definition of '+word);
  label.title=lesson?'Word List 9: tap for packet definition':'Tap for dictionary definition';label.onclick=()=>openDefinition(word);
  row.append(check,label);opts.append(row);});
 body.append(opts);
 const r=elem('div','relation-row');r.append(elem('div','pair-label','These two words are…'));
 [['S','S · Synonyms'],['A','A · Antonyms']].forEach(([code,txt])=>{const b=elem('button','relation-btn'+(a.relation===code?' active':''),txt);b.type='button';b.dataset.f='r'+code;b.setAttribute('aria-pressed',String(a.relation===code));b.onclick=()=>setAnswer(i,{pair:a.pair,relation:a.relation===code?'':code},'r'+code);r.append(b);});
 body.append(r);
 const s=elem('div','review-status');s.setAttribute('aria-live','polite');card.append(s);return card;}
function init(){renderBank($('wordBank'));
 const dir=$('directions');dir.textContent='🔊 '+D.directions;dir.onclick=()=>speak(D.directions);
 $('speakingToast').onclick=cancelSpeak;$('closeDefinition').onclick=()=>{$('definitionDialog').close();cancelSpeak();};
 $('definitionDialog').addEventListener('click',e=>{if(e.target===$('definitionDialog')){$('definitionDialog').close();cancelSpeak();}});$('definitionDialog').addEventListener('close',cancelSpeak);
 $('clearBtn').onclick=resetAll;$('exportBtn').onclick=exportPrint;
 for(let i=0;i<qs.length;i++){$('questionList').append(buildCard(i));const pip=elem('span','pip');pip.setAttribute('role','listitem');$('progressPips').append(pip);}
 qs.forEach((q,i)=>paintStatus(i));updateProgress();
 $('checkBtn').onclick=requestCheck;$('keepWorking').onclick=hideIncompleteWarning;$('checkAnyway').onclick=checkAll;
 $('adultUnlockButton').onclick=openAdultUnlock;$('adultCancel').onclick=cancelAdultUnlock;$('adultGrant').onclick=grantOneMoreCheck;
 $('adultCheckCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();grantOneMoreCheck();}});}
function printableShell(title,body){return '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{max-width:820px;margin:26px auto;padding:0 20px;font:15px/1.56 Arial,sans-serif;color:#182332}h1{font-size:22px;margin-bottom:4px}.name-line{display:flex;gap:25px;flex-wrap:wrap;margin:12px 0 20px}.line{display:inline-block;min-width:155px;border-bottom:1px solid #333}.print-q{margin:13px 0;break-inside:avoid}.print-d-row{display:flex;align-items:baseline;white-space:nowrap;font-size:14px;line-height:1.6}.print-d-number{flex:0 0 30px;font-weight:bold}.print-d-words{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;flex:1;min-width:0}.print-d-word{white-space:nowrap}.print-d-sa{display:flex;gap:20px;margin-left:28px;flex:0 0 auto;padding-right:10px}.print-d-marked{font-weight:800;text-decoration-line:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}.source{margin-top:28px;font-size:11px;color:#555}.print-header{font-weight:bold}button{padding:8px 16px}@media print{button{display:none}@page{margin:.68in}body{margin:0;padding:0}}</style></head><body><button onclick="window.print()">Print / Save as PDF</button><h1>'+esc(title)+'</h1><div class="name-line"><span>Name: <b class="line">Tina #14</b></span></div>'+body+'<p class="source">Wordly Wise 3000 · Book 6 · Lesson 9</p></body></html>';}
function exportPrint(){cancelSpeak();let body='<p class="print-header">'+esc(D.directions)+'</p>';
 qs.forEach((q,i)=>{const a=state.answers[i];
  // In-place marking of the student's own choices (never the answer key).
  const mark=(label,chosen)=>chosen?'<strong class="print-d-marked">'+esc(label)+'</strong>':esc(label);
  body+='<section class="print-q"><div class="print-d-row"><span class="print-d-number">'+(i+1)+'.</span><span class="print-d-words">'+q.words.map((word,k)=>'<span class="print-d-word">'+mark(word,a.pair.includes(k))+'</span>').join('')+'</span><span class="print-d-sa"><span>'+mark('S',a.relation==='S')+'</span><span>'+mark('A',a.relation==='A')+'</span></span></div></section>';});
 const file=printableShell('Wordly Wise Lesson 9D · '+D.title,body);const url=URL.createObjectURL(new Blob([file],{type:'text/html;charset=utf-8'}));const a=elem('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
init();
</script></body></html>
