<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-start:#e0f4ff;--bg-end:#f0e8ff;--card-bg:#fff;--text-primary:#1a2a3a;--text-muted:#6a8299;

}
*{box-sizing:border-box}

button,input{font:inherit}

button:focus-visible,[role=button]:focus-visible,summary:focus-visible{outline:3px solid #6b43a3;outline-offset:3px}

.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.back-link,.wordlist-toggle{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 13px;border-radius:12px;border:1.5px solid #a9c6da;background:#fff;color:var(--accent-blue-dk);font-weight:800;text-decoration:none}
h1,h2,h3{font-family:'Fredoka One','Arial Rounded MT Bold',Arial,sans-serif;font-weight:400}
h1{text-align:center;margin:4px 0 3px;font-size:1.75rem}

.question-card,.word-list-panel,.progress{background:var(--card-bg);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.10)}
.question-card{padding:16px 18px;border:2.5px solid transparent;margin-bottom:13px}

.card-head{display:flex;align-items:flex-start;gap:10px}

.card-main{flex:1;min-width:0}

.play-btn{background:var(--btn-play);border:0;border-radius:50%;width:44px;height:44px;min-width:44px;font-size:1.05rem;box-shadow:0 2px 8px rgba(93,202,126,.4)}
.play-btn:hover{background:var(--btn-play-dk)}

.feedback.show{display:flex}
.feedback.correct{background:var(--feedback-ok-bg);color:var(--feedback-ok-txt)}

.speaking-toast.visible{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}

.bank-word{min-height:44px;border-radius:11px;border:2px solid var(--phrase-border);background:var(--phrase-bg);color:var(--phrase-text);font-weight:900}
dialog{border:0;border-radius:20px;width:min(650px,calc(100vw - 26px));max-height:86dvh;padding:0;box-shadow:0 14px 60px #1b294449;color:var(--text-primary)}
dialog::backdrop{background:#17334f66}
.modal-head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid #dce7f1;z-index:2}
.modal-head h2{font-size:1.35rem;margin:0}.close-btn{min-height:44px;padding:7px 13px;border-radius:12px;border:1px solid #b8cbdc;background:#f1f6fb;color:var(--accent-blue-dk);font-weight:800}
.modal-body{padding:15px 17px}
.definition-box{background:#f8fbff;border:1px solid #d7e6f2;border-radius:13px;padding:12px;margin:0 0 11px}
.definition-box p{line-height:1.65;margin:0 0 9px}.definition-box strong{display:block;margin-bottom:5px}
.read-def{min-height:44px;border:0;border-radius:11px;background:var(--btn-play);font-weight:800;padding:7px 12px}
.vocab-chip{display:inline-flex;align-items:center;min-height:44px;padding:3px 9px;border-radius:9px;background:var(--phrase-bg);border:2px solid var(--phrase-border);color:var(--phrase-text);font-weight:900}
.plain-word{display:inline;border:0;background:transparent;padding:0 1px;margin:0;font:inherit;color:inherit;min-height:0;min-width:0;border-radius:3px}
.plain-word:hover{background:#e6f3ff}
.muted{color:var(--text-muted);font-size:.9rem}
@media(max-width:520px){body{padding:12px 9px 70px}.question-card{padding:13px}.word-bank{grid-template-columns:repeat(2,1fr)}h1{font-size:1.48rem}.prompt{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.option-row{display:grid;grid-template-columns:50px 1fr;gap:9px;align-items:stretch;margin:8px 0}
.pick-btn{min-height:50px;border:2px solid #9abbd3;background:#fff;border-radius:12px;font-weight:900;color:var(--accent-blue-dk)}
.pick-btn.selected{background:#dcedfa;border-color:var(--accent-blue-dk)}
.phrase-read{min-height:50px;text-align:left;border:1.5px solid #d5e3ed;background:#f9fcff;border-radius:12px;padding:9px 12px;font-weight:700;color:var(--text-primary)}
.assembled{margin-top:10px;background:#f4f9fd;border-radius:12px;padding:10px 12px;line-height:1.5;font-weight:800}
</style></head>
<body><main class="app">
<div class="topnav"><a class="back-link" href="2026-10-05-wordly-wise-lesson-3-index.html">← Lesson 3</a><span class="muted">Exercise 3A</span></div>
<p class="eyebrow">Wordly Wise · Lesson 3</p><h1>3A Finding Meanings</h1><p class="subtitle">Choose two phrases. One exercise at a time.</p>

<button class="instructions" id="instructions" onclick="speak(this.dataset.speech)" data-speech="Choose two phrases to form a sentence that correctly uses a word from Word List 3. Write each sentence on the line provided.">🔊 Choose two phrases to form a sentence that correctly uses a word from Word List 3. Write each sentence on the line provided.</button>
<details class="word-list-panel"><summary>📖 Word List 3 · tap for definitions</summary><div class="word-bank" id="wordBank"></div></details>
<section id="questions"></section>
<div class="progress"><div class="pips" id="pips"></div><span class="progress-count" id="progressCount"></span></div>
<div class="footer-actions"><button class="clear-btn" id="clearBtn">🗑️ Clear all responses</button><button class="export-btn" onclick="exportPrint()">🖨️ Export / Print</button></div>

</main>
<dialog id="definitionDialog" aria-labelledby="definitionTitle">
  <header class="modal-head"><h2 id="definitionTitle"></h2><button class="close-btn" onclick="closeDefinition()">✕ Close</button></header>
  <div class="modal-body"><button id="readWord" class="read-def" style="margin-bottom:12px">🔊 Word</button><div id="definitionBody"></div></div>
</dialog>
<button class="speaking-toast" id="speakingToast" onclick="cancelSpeak()">🔊 <span>Reading aloud… tap to stop</span></button>

<script>'use strict'; const wordEntries=[{"word": "abundant", "paragraphs": [{"label": "abundant · adjective", "text": "More than enough; plentiful. If good weather continues, farmers can expect an abundant harvest."}, {"label": "abundance · noun", "text": "A great amount. Natural gas supplies an abundance of power to the entire country."}]}, {"word": "arid", "paragraphs": [{"label": "arid · adjective", "text": "Having little or no rainfall; very dry. Much of North Africa is arid land."}]}, {"word": "distinct", "paragraphs": [{"label": "distinct · adjective · 1", "text": "Not the same; different or separate. Apples come in over two thousand distinct varieties."}, {"label": "distinct · adjective · 2", "text": "Unmistakable; definite. Chili peppers add a distinct flavor to this dish."}]}, {"word": "graze", "paragraphs": [{"label": "graze · verb · 1", "text": "To feed on growing grass. A small herd of cows grazed in the meadow."}, {"label": "graze · verb · 2", "text": "To touch lightly in passing. The snowball grazed my cheek but didn’t hurt me."}]}, {"word": "hectic", "paragraphs": [{"label": "hectic · adjective", "text": "Full of feverish activity, haste, or confusion. After a hectic week of sightseeing, the tourists were glad to go home and relax."}]}, {"word": "horde", "paragraphs": [{"label": "horde · noun", "text": "A large group or crowd, especially one on the move. Hordes of swimmers head for the pool in summer."}]}, {"word": "humid", "paragraphs": [{"label": "humid · adjective", "text": "Having a large amount of water or moisture in the air. Residents escape the hot, humid weather by going inside where it is cool and dry."}, {"label": "humidity · noun", "text": "The amount of moisture in the air. The humidity was so high that the slightest activity made us sweat."}]}, {"word": "incredible", "paragraphs": [{"label": "incredible · adjective", "text": "Hard or impossible to believe. It seems incredible that no one was injured in such a bad accident."}]}, {"word": "inhabit", "paragraphs": [{"label": "inhabit · verb", "text": "To live in or on. Millions of bison once inhabited the great plains of America."}, {"label": "inhabitant · noun", "text": "A person or animal that lives in a certain place. Most of the inhabitants of California were born somewhere else."}]}, {"word": "peninsula", "paragraphs": [{"label": "peninsula · noun", "text": "A piece of land, connected to a larger land mass, that juts out and is almost completely surrounded by water. Bays along the Baja peninsula provide shelter for several kinds of whales."}]}, {"word": "rural", "paragraphs": [{"label": "rural · adjective", "text": "Of or relating to the country and the people who live there. The villagers believe that a shopping mall has no place in a rural area."}]}, {"word": "sanctuary", "paragraphs": [{"label": "sanctuary · noun · 1", "text": "A place of safety or shelter. The temple was a sanctuary to those who were being persecuted."}, {"label": "sanctuary · noun · 2", "text": "Protection offered by such a place. The shelter offers sanctuary to women fleeing violence in the home."}]}, {"word": "splendor", "paragraphs": [{"label": "splendor · noun", "text": "Magnificence; brilliance of appearance. The splendor of the palace at Versailles took our breath away."}, {"label": "splendid · adjective", "text": "Very impressive; magnificent. The exhibition of American sculpture includes several splendid statues by Harriet Hosmer."}]}, {"word": "squalor", "paragraphs": [{"label": "squalor · noun", "text": "Filth; misery. People lived in squalor after their homes were destroyed by the hurricane."}, {"label": "squalid · adjective", "text": "Dirty and unfit for living, especially as a result of neglect. The newly arrived immigrants worked long hours in squalid conditions for very low wages."}]}, {"word": "terrain", "paragraphs": [{"label": "terrain · noun · 1", "text": "An area of land; a region. After hiking for several days we knew the terrain quite well."}, {"label": "terrain · noun · 2", "text": "The surface features of a region. The mountainous terrain of western Colorado attracts skiers from all parts of the country."}]}]; 
function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.88; u.pitch=1.05;
  u.onstart=()=>document.getElementById('speakingToast').classList.add('visible');
  const hide=()=>document.getElementById('speakingToast').classList.remove('visible');
  u.onend=hide; u.onerror=hide;
  window.speechSynthesis.speak(u);
}
function cancelSpeak(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); document.getElementById('speakingToast').classList.remove('visible');}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function openDefinition(word){
  const e=wordEntries.find(x=>x.word===word);
  if(!e)return;
  cancelSpeak();
  document.getElementById('definitionTitle').textContent=e.word;
  const body=document.getElementById('definitionBody'); body.innerHTML='';
  e.paragraphs.forEach(p=>{
    const box=document.createElement('div'); box.className='definition-box';
    const strong=document.createElement('strong'); strong.textContent=p.label;
    const txt=document.createElement('p'); txt.textContent=p.text;
    const b=document.createElement('button'); b.className='read-def'; b.textContent='▶ Read this paragraph';
    b.onclick=()=>speak(p.label+'. '+p.text);
    box.append(strong,txt,b); body.appendChild(box);
  });
  document.getElementById('readWord').onclick=()=>speak(e.word);
  document.getElementById('definitionDialog').showModal();
}
function renderWordBank(containerId){
  const b=document.getElementById(containerId); if(!b)return;
  wordEntries.forEach(e=>{
    const bt=document.createElement('button'); bt.className='bank-word'; bt.textContent=e.word; bt.onclick=()=>openDefinition(e.word); b.appendChild(bt);
  });
}
function closeDefinition(){document.getElementById('definitionDialog').close(); cancelSpeak();}
document.addEventListener('click',e=>{
  const d=document.getElementById('definitionDialog');
  if(d && d.open && e.target===d) closeDefinition();
});
function doubleTapClear(btn,clearFn){
  if(btn.dataset.confirming==='true'){
    clearFn(); btn.dataset.confirming='false'; btn.textContent='🗑️ Clear all responses'; btn.removeAttribute('style'); return;
  }
  btn.dataset.confirming='true'; btn.textContent='⚠️ Tap again to confirm';
  btn.style.background='#ffeedd'; btn.style.color='#c05000'; btn.style.borderColor='#c05000';
  setTimeout(()=>{if(btn.dataset.confirming==='true'){btn.dataset.confirming='false';btn.textContent='🗑️ Clear all responses';btn.removeAttribute('style');}},3000);
}
function downloadPrintHtml(htmlText){
  const blob=new Blob([htmlText],{type:'text/html'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function printShell(title,body){
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>body{font-family:Arial,sans-serif;color:#111;margin:28px;line-height:1.45}.name-line{display:flex;gap:22px;margin:12px 0 22px}.name-line span{display:flex;align-items:flex-end;gap:6px}.line{display:inline-block;width:180px;border-bottom:1.5px solid #333}.item{margin:0 0 14px;break-inside:avoid}.selected{font-weight:700}.footer{margin-top:28px;font-size:12px;color:#555}button{padding:9px 14px}@media print{button{display:none}}</style></head><body>
  <button onclick="window.print()">Print</button><h1>${esc(title)}</h1><div class="name-line"><span>Name: <span class="line">Tina #18</span></span><span>Date: <span class="line"></span></span></div>${body}
  <div class="footer">Source: Wordly Wise 3000 · Book 6 · Lesson 3</div></body></html>`;
}
 
const STORAGE_KEY='worksheet_wordly_wise_lesson_3a_2026_10_05_v1';
const questions=[{"phrases": [["a", "Squalid areas are those"], ["b", "with little rainfall."], ["c", "Rural areas are those"], ["d", "away from large cities."]], "answer": ["c", "d"], "hint": "Rural means “of or relating to the country and the people who live there.”"}, {"phrases": [["a", "a place where prisoners are held before trial."], ["b", "land almost completely surrounded by water."], ["c", "A sanctuary is"], ["d", "A peninsula is"]], "answer": ["b", "d"], "hint": "A peninsula is “a piece of land, connected to a larger land mass, that juts out and is almost completely surrounded by water.”"}, {"phrases": [["a", "Something that is abundant is"], ["b", "hard to understand."], ["c", "Something that is incredible is"], ["d", "hard to believe."]], "answer": ["c", "d"], "hint": "Incredible means “hard or impossible to believe.”"}, {"phrases": [["a", "dampness in the air."], ["b", "Terrain is"], ["c", "Humidity is"], ["d", "the condition of being hot."]], "answer": ["a", "c"], "hint": "Humidity means “the amount of moisture in the air.”"}, {"phrases": [["a", "A squalid building is"], ["b", "A splendid building is"], ["c", "one that is not lived in."], ["d", "one that is dirty and neglected."]], "answer": ["a", "d"], "hint": "Squalid means “dirty and unfit for living, especially as a result of neglect.”"}, {"phrases": [["a", "A horde is"], ["b", "a place where one may find safety."], ["c", "An abundance is"], ["d", "a large crowd on the move."]], "answer": ["a", "d"], "hint": "A horde is “a large group or crowd, especially one on the move.”"}, {"phrases": [["a", "A splendid change is"], ["b", "A distinct change is"], ["c", "one that goes unnoticed."], ["d", "one that is unmistakable."]], "answer": ["b", "d"], "hint": "One meaning of distinct is “unmistakable; definite.”"}, {"phrases": [["a", "Sanctuary is"], ["b", "the surface features of an area."], ["c", "Terrain is"], ["d", "a lack of confidence in oneself."]], "answer": ["b", "c"], "hint": "One meaning of terrain is “the surface features of a region.”"}];
let state={items:questions.map(()=>({selected:[],checked:false,correct:false})),answeredCount:0,total:questions.length};
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&Array.isArray(s.items)&&s.items.length===questions.length)state=s;}catch(e){}}
function sentenceFor(i){
  const q=questions[i], selected=state.items[i].selected;
  if(selected.length!==2)return 'Choose two phrases.';
  const ps=selected.map(id=>q.phrases.find(p=>p[0]===id)[1]);
  const starter=ps.find(t=>/^[A-Z]/.test(t))||ps[0];
  const ending=ps.find(t=>t!==starter)||ps[1];
  return (starter+' '+ending).replace(/\s+/g,' ').trim();
}
function save(){
  state.answeredCount=state.items.filter(x=>x.selected.length===2).length; state.total=questions.length;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
  updateProgress();
}
function toggle(i,id){
  const s=state.items[i];
  if(s.selected.includes(id))s.selected=s.selected.filter(x=>x!==id);
  else if(s.selected.length<2)s.selected.push(id);
  else return;
  s.checked=false;s.correct=false;save();renderCard(i);
  if(s.selected.length===2)setTimeout(()=>speak(sentenceFor(i)),300);
}
function check(i){
  const s=state.items[i]; if(s.selected.length!==2)return;
  s.checked=true; s.correct=[...s.selected].sort().join('')===[...questions[i].answer].sort().join('');
  save(); renderCard(i);
}
function renderCard(i){
  const q=questions[i], s=state.items[i], card=document.getElementById('card-'+i);
  if(!card)return;
  card.classList.toggle('correct',s.correct);
  q.phrases.forEach(p=>{
    const b=document.getElementById(`pick-${i}-${p[0]}`);
    b.classList.toggle('selected',s.selected.includes(p[0]));
    b.textContent=s.selected.includes(p[0])?'✓':p[0];
    b.setAttribute('aria-pressed',s.selected.includes(p[0])?'true':'false');
    b.disabled=!s.selected.includes(p[0])&&s.selected.length>=2;
  });
  const a=document.getElementById('assembled-'+i); a.textContent=sentenceFor(i);
  const cb=document.getElementById('check-'+i); cb.disabled=s.selected.length!==2; cb.classList.toggle('done',s.correct);
  const fb=document.getElementById('fb-'+i); fb.className='feedback';
  if(s.checked){fb.classList.add('show',s.correct?'correct':'hint');fb.textContent=s.correct?'✅ That sentence uses the word correctly.':'💡 Hint: '+q.hint;}
}
function build(){
  renderWordBank('wordBank'); const wrap=document.getElementById('questions');
  questions.forEach((q,i)=>{
    const card=document.createElement('article'); card.className='question-card'; card.id='card-'+i;
    const opts=q.phrases.map(p=>`<div class="option-row"><button class="pick-btn" id="pick-${i}-${p[0]}" onclick="toggle(${i},'${p[0]}')" aria-label="Select phrase ${p[0]}">${p[0]}</button><button class="phrase-read" onclick='speak(${JSON.stringify(p[1])})'>🔊 ${esc(p[1])}</button></div>`).join('');
    card.innerHTML=`<div class="card-head"><div class="qnum">${i+1}.</div><div class="card-main">${opts}<div class="assembled" id="assembled-${i}"></div><button class="check-btn" id="check-${i}" onclick="check(${i})">📝 Check answer</button><div id="fb-${i}" class="feedback"></div></div><button class="play-btn" onclick="speak(sentenceFor(${i}))" title="Read your sentence">▶</button></div>`;
    wrap.appendChild(card); renderCard(i);
  }); updateProgress();
}
function updateProgress(){
  const p=document.getElementById('pips'); p.innerHTML='';
  state.items.forEach(s=>{const d=document.createElement('span');d.className='pip'+(s.correct?' done':s.selected.length===2?' answered':'');p.appendChild(d);});
  document.getElementById('progressCount').textContent=state.items.filter(x=>x.selected.length===2).length+' / '+questions.length+' answered';
}
document.getElementById('clearBtn').onclick=function(){doubleTapClear(this,()=>{try{localStorage.removeItem(STORAGE_KEY)}catch(e){};location.reload();})};
function exportPrint(){
  let body=''; questions.forEach((q,i)=>{const s=state.items[i];const ans=s.selected.length===2?sentenceFor(i):'____________________________';body+=`<div class="item"><strong>${i+1}.</strong> ${esc(ans)}</div>`;});
  downloadPrintHtml(printShell('Wordly Wise Lesson 3A — Finding Meanings',body));
}
load(); build();
</script></body></html>
