</style></head><body><div class="app"><header class="topbar"><div><p class="topbar-sub">WORDLY WISE 3000 · BOOK 6 · LESSON 5B</p><h1>Just the Right Word</h1></div><a class="backlink" href="2026-10-19-wordly-wise-lesson-5-index.html">← Lesson 5</a></header><button class="instructions" id="directions" type="button"></button><aside class="bank-panel" aria-label="Vocabulary reference"><p class="bank-title">Word List 5 · tap a word for its definition</p><div id="wordBank" class="word-bank"></div></aside><main class="question-list" id="questionList"></main><div class="progress-panel"><div class="progress-heading" id="progressText">0 answered</div><div class="pips" id="progressPips" aria-label="Question completion"></div></div><div class="check-panel"><div><strong>Check all responses</strong><div class="check-help" id="checksRemaining" aria-live="polite">3 of 3 checks remaining</div></div><button type="button" id="checkBtn" class="check-btn">✅ Check all responses</button></div><div class="incomplete-warning" id="incompleteWarning" role="status" aria-live="polite"><div id="incompleteText"></div><div class="warn-actions"><button type="button" class="warn-btn" id="keepWorking">Keep working</button><button type="button" class="warn-btn" id="checkAnyway">Check anyway · use 1 check</button></div></div><div class="footer-actions"><button type="button" id="clearBtn" class="clear-btn">🗑️ Clear all responses</button><button type="button" id="exportBtn" class="export-btn">🖨️ Export / Print</button></div><div class="save-status" id="saveStatus" aria-live="polite">Autosaves on this device</div></div><dialog class="modal" id="definitionDialog" aria-labelledby="definitionTitle"><div class="modal-heading"><h2 id="definitionTitle">Definition</h2><button type="button" class="close-btn" id="closeDefinition" aria-label="Close definition">✕</button></div><div class="modal-main" id="definitionBody"></div></dialog><button id="speakingToast" class="speaking-toast" type="button" aria-label="Stop reading aloud">🔊 Speaking… · tap to stop</button><script id="appData" type="application/json">{"section":"B","title":"Just the Right Word","directions":"Replace each phrase in bold with a single word (or form of the word) from the word list.","questions":[{"before":"The children’s ","phrase":"playful acts","after":" made their parents roar with laughter.","answer":"antics","pos":"noun","hint":"Look for the plural noun meaning funny or playful acts."},{"before":"Your ","phrase":"ability to do so many things well","after":" was what impressed me the most.","answer":"versatility","pos":"noun","hint":"A related noun of versatile describes the state of being able to do many things."},{"before":"What is the correct ","phrase":"clothing that should be worn","after":" for an awards banquet?","answer":"attire","pos":"noun","hint":"Look for the noun that means clothing, especially fine clothes."},{"before":"She ","phrase":"completely won over","after":" the audience with her fine performance.","answer":"captivated","pos":"verb","hint":"The correct verb means to win someone over by charm."},{"before":"I admire the ","phrase":"very skillful","after":" way you handled what could have been an embarrassing situation.","answer":"deft","pos":"adjective","hint":"This adjective describes a quick, sure, skillful action."},{"before":"When is the next ","phrase":"time that the earth will pass directly between the sun’s position and that of the moon","after":"?","answer":"eclipse","pos":"noun","hint":"Think about the noun for the hiding of one heavenly body by another."},{"before":"My aunt’s exceptional vigor was ","phrase":"present from the time of her birth","after":"; even as an infant she was active and strong.","answer":"innate","pos":"adjective","hint":"The adjective describes something present naturally from birth."},{"before":"Your backache is probably caused by your poor ","phrase":"way of holding your body","after":".","answer":"posture","pos":"noun","hint":"The noun refers to the way one holds the body."},{"before":"The bride ","phrase":"struggled to hold back","after":" a giggle when the nervous bridegroom dropped the ring during the ceremony.","answer":"stifled","pos":"verb","hint":"This verb can mean holding something back or checking it."},{"before":"A thick fog ","phrase":"hid from sight everything that was in","after":" the harbor.","answer":"shrouded","pos":"verb","hint":"This verb means to block something from sight."}],"words":[{"word":"antic","senses":[["antic","noun","(usually plural) A playful or funny act.","The antics of the clown made the crowd roar with laughter."]]},{"word":"attire","senses":[["attire","noun","Clothes, especially fine and expensive clothes.","One often needs special attire to be in a wedding party."],["attire","verb","To dress up or be dressed up.","The designer attired the models in shirts and trousers for the fashion show."]]},{"word":"captivate","senses":[["captivate","verb","To please greatly; to win over by special charm.","The cast’s superb acting captivated the audience."]]},{"word":"deft","senses":[["deft","adjective","Quick and sure; skillful at handling.","A deft juggler can keep five or more objects in the air at one time."]]},{"word":"diligent","senses":[["diligent","adjective","Working with great care and effort.","Diligent students succeed in reaching their goals."]]},{"word":"eclipse","senses":[["eclipse","noun","The total or partial hiding of one heavenly body by another.","An eclipse of the sun occurs when the moon passes directly in front of it."],["eclipse","verb","To do or be better than; to outshine.","Her latest novel eclipses all her previous work."]]},{"word":"evolve","senses":[["evolve","verb","To develop and change gradually over time.","Scientists think that modern birds may have evolved from dinosaurs."],["evolution","noun","The changes that take place as something evolves.","The evolution of aircraft from the Wright brothers’ flimsy plane to the modern jet airplane occurred over an incredibly short time."]]},{"word":"innate","senses":[["innate","adjective","Having from birth; occurring naturally rather than being learned.","The singer’s innate musical ability showed itself at a very early age."]]},{"word":"inscribe","senses":[["inscribe","verb","To write, print, or etch into as a permanent record.","Most of the gravestones were simply inscribed with the person’s name, date of birth, and date of death."],["inscription","noun","The act of inscribing or what is inscribed.","Coins of the United States bear the inscription E Pluribus Unum, a Latin phrase that means “Out of many, one.”"]]},{"word":"posture","senses":[["posture","noun","The way one holds one’s body; a pose or position.","You can improve your posture by throwing your shoulders back."],["posture","verb","To assume a particular position, especially a pretended one.","They postured as my friends while secretly talking behind my back."]]},{"word":"shroud","senses":[["shroud","noun","1. Something that covers or hides from view.","A shroud of mystery surrounds the couple’s disappearance."],["shroud","noun","2. Cloth used to wrap a dead body before burial.","It used to be the custom to make a shroud from a long linen sheet dipped in melted wax."],["shroud","verb","To block from sight.","Dense fog on the river shrouded the tugboats."]]},{"word":"stifle","senses":[["stifle","verb","1. To cut off the air from; to smother.","Thick smoke stifled those who sat around the campfire."],["stifle","verb","2. To hold back; to check.","The spectators tried to stifle their yawns during the lengthy ceremony."]]},{"word":"tentative","senses":[["tentative","adjective","Not fully worked out or final; hesitating or uncertain.","The deadline is tentative and may be extended."]]},{"word":"tranquil","senses":[["tranquil","adjective","Calm; peaceful.","The sea was tranquil with no hint of the approaching storm."],["tranquility","noun","The state of being tranquil.","Many authors prefer writing during the tranquility of early morning before anyone else is up."]]},{"word":"versatile","senses":[["versatile","adjective","Able to do many different things or to be used in many different ways.","She is a versatile musician who can play eight instruments."],["versatility","noun","The state or condition of being versatile.","The tomato’s versatility and distinct flavor make it a favorite of many cooks."]]}],"vocabForms":{"antic":"antic","attire":"attire","captivate":"captivate","deft":"deft","diligent":"diligent","eclipse":"eclipse","evolve":"evolve","innate":"innate","inscribe":"inscribe","posture":"posture","shroud":"shroud","stifle":"stifle","tentative":"tentative","tranquil":"tranquil","versatile":"versatile","antics":"antic","attired":"attire","captivated":"captivate","diligently":"diligent","eclipsed":"eclipse","evolved":"evolve","inscription":"inscribe","postures":"posture","shrouded":"shroud","tranquility":"tranquil","versatility":"versatile"},"bChoices":[["antics","noun","antic"],["attire","noun","attire"],["captivated","verb","captivate"],["deft","adjective","deft"],["diligent","adjective","diligent"],["eclipse","noun","eclipse"],["evolved","verb","evolve"],["innate","adjective","innate"],["inscription","noun","inscribe"],["posture","noun","posture"],["shrouded","verb","shroud"],["stifled","verb","stifle"],["tentative","adjective","tentative"],["tranquil","adjective","tranquil"],["versatility","noun","versatile"]],"eCandidates":[["antic","antic / antics"],["deft","deft"],["diligent","diligent / diligently"],["evolve","evolve / evolved / evolution"],["innate","innate"],["shroud","shroud / shrouded"],["tranquil","tranquil / tranquility"]],"storyTitle":"A Born Artist","paragraphs":[["To exhibit one’s work at the Smithsonian Institution in Washington, D.C., would be a high point in any artist’s career; to receive such an honor at the age of fourteen is truly remarkable.","Yet that was the age of the Chinese painter Wang Yani when her paintings were given their first American showing there in 1989.","Hundreds of thousands of visitors came and were captivated by her pictures of animals, birds, and landscapes.","And in the Smithsonian’s Sackler Gallery, audiences were able to watch as Yani, barefoot and attired casually in shirt and denim shorts, walked on stage.","With deft strokes of the brush, she produced works of art right before their eyes.","She did so with total concentration, seemingly unaware of the onlookers."],["If fourteen seems a young age to receive so much attention, consider this: Yani’s first exhibition, in her native China, was held when she was four!","She has been working diligently at her art since the age of two; that was when Wang Shi Chiang first became aware of his daughter’s interest in painting.","Himself a well-known artist, he encouraged Yani by providing her with large sheets of paper, ink, and brushes.","These are the traditional materials of Chinese painting.","He never gave her a lesson and also discouraged her teachers at school from doing so.","He believed such instruction would only stifle her imagination and prevent her from expressing her feelings freely.","His faith in his daughter’s innate talent was fully justified by her early success.","In fact, Wang Yani’s fame soon eclipsed her father’s fame."],["Yani’s first subjects were monkeys.","She became fascinated with their antics after a visit to the local zoo.","She has painted hundreds of pictures of them.","One of her favorites is thirty feet long and took just four hours to complete.","It shows 112 monkeys in various postures, each with a different expression."],["As she grew older, she became more versatile and began painting other creatures such as birds, horses, and lions.","Later, her style evolved.","She broadened her range of subjects to include trees, flowers, and, especially, landscapes.","Her interest in landscapes is not surprising, because Yani lives in a region of great natural beauty in southern China, with gently rolling hills, clear streams, and ancient temples.","Not far away are the famous cone-shaped Guilin mountains.","The mountains are often shrouded in mist and are a favorite subject of the young painter.","Yani paints what she feels about what she sees rather than simply what she sees.","In her paintings of the mountains, she tries to capture the feeling of tranquility that she experienced while visiting the scene."],["She often begins by spilling ink onto the paper, a method known as po-mo.","She follows this with a few tentative strokes.","Then she proceeds rapidly until the painting is completed, often in less than half an hour.","Yani often includes an inscription in Chinese characters as part of a painting.","A typical one reads, “Autumn is a withering season for the trees, but the animals are happy.”"],["By the time she was sixteen, Yani had painted more than ten thousand pictures.","Today, as an adult, she is still painting.","Her work continues to grow and change.","She finds new ideas in nature and in the changing world around her.","She also finds them through singing and dancing.","These are skills that she feels have helped with her painting.","In a good painting, according to a Chinese saying, “the brush sings and the ink dances.”"]]}</script><script>'use strict';
const D=JSON.parse(document.getElementById('appData').textContent);
const section=D.section;
const qs=D.questions;
const storageKey='hemi-ww-book6-lesson5-'+section.toLowerCase()+'-20261019-v1';
const MAX_CHECKS=3;
const $=id=>document.getElementById(id);
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function elem(tag,cl,txt){const e=document.createElement(tag);if(cl)e.className=cl;if(txt!=null)e.textContent=txt;return e;}
const letters=['a','b','c','d'];
const defaultAnswer=()=>section==='A'||section==='C'?[]:section==='D'?{pair:[],relation:''}:section==='E'?{text:'',word:''}:'';
function initState(){let old;try{old=JSON.parse(localStorage.getItem(storageKey)||'null');}catch(e){}const a=Array.isArray(old?.answers)?old.answers:[];
 const answers=qs.map((q,i)=>{const x=a[i];const def=defaultAnswer();if(section==='A'||section==='C')return Array.isArray(x)?x.filter(y=>typeof y==='string'):def;
 if(section==='D')return x&&Array.isArray(x.pair)&&typeof x.relation==='string'?{pair:x.pair.filter(y=>Number.isInteger(y)),relation:x.relation}:def;
 if(section==='E')return x&&typeof x.text==='string'&&typeof x.word==='string'?x:def;
 return typeof x==='string'?x:def;});
 const rev=old?.review||{};return {answers,hinted:Array.isArray(old?.hinted)?old.hinted.slice(0,qs.length):qs.map(()=>false),review:{checksUsed:Math.min(MAX_CHECKS,Math.max(0,Number(rev.checksUsed)||0)),statuses:Array.isArray(rev.statuses)&&rev.statuses.length===qs.length?rev.statuses:qs.map(()=>''),revised:Array.isArray(rev.revised)&&rev.revised.length===qs.length?rev.revised:qs.map(()=>false)}};}
let state=initState();
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));$('saveStatus').textContent='Saved on this device';}catch(e){$('saveStatus').textContent='Autosave unavailable · Export / Print keeps a copy';}}
let speechTimeout;
function cancelSpeak(){clearTimeout(speechTimeout);try{speechSynthesis.cancel();}catch(e){}$('speakingToast').classList.remove('show');}
function speak(text){if(!text)return;cancelSpeak();if(!('speechSynthesis' in window)){return;}
 const u=new SpeechSynthesisUtterance(String(text));u.rate=.88;u.pitch=1.05;u.lang='en-US';
 u.onend=u.onerror=()=>{$('speakingToast').classList.remove('show');};$('speakingToast').textContent='🔊 Speaking… · tap to stop';$('speakingToast').classList.add('show');
 speechTimeout=setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){$('speakingToast').classList.remove('show');}},30);}
const posAbbr={noun:'n',verb:'v',adjective:'adj',adverb:'adv'};
function tag(pos){return '<span class="pos pos-'+esc(pos)+'">'+esc(posAbbr[pos]||pos)+'</span>';}
function renderBank(container){container.innerHTML='';for(const item of D.words){let pos=[...new Set(item.senses.map(s=>s[1]))];let b=elem('button','bank-word');b.type='button';b.setAttribute('aria-label','Definition of '+item.word);b.innerHTML='<span>'+esc(item.word)+'</span>'+pos.map(tag).join('');b.addEventListener('click',()=>openDefinition(item.word));container.append(b);}}
function openDefinition(word,readWord=false){const w=String(word||'').toLowerCase();const root=D.vocabForms[w]||w;const item=D.words.find(e=>e.word===root);if(!item){speak(word);return;}
 const dlg=$('definitionDialog'),rootEl=$('definitionBody');$('definitionTitle').textContent=item.word;rootEl.innerHTML='';
 for(const sense of item.senses){const [label,pos,definition,example]=sense;const wrap=elem('div','definition-card');const play=elem('button','definition-play','▶');play.type='button';play.setAttribute('aria-label','Read definition and example aloud');play.onclick=()=>speak(label+'. '+pos+'. Definition: '+definition+' Example: '+example);
 const box=elem('div');box.innerHTML='<div class="definition-label">'+esc(label)+' '+tag(pos)+'</div><div class="definition-row"><div class="definition-kind">Definition</div><div class="definition-text">'+esc(definition)+'</div></div><div class="definition-row"><div class="definition-kind example">Example</div><div class="definition-text example">'+esc(example)+'</div></div>';wrap.append(play,box);rootEl.append(wrap);}
 cancelSpeak();if(!dlg.open)dlg.showModal();if(readWord)speak(word);
}
function isAnswered(i){const a=state.answers[i];if(section==='A')return a.length===2;if(section==='C')return a.length>0;if(section==='D')return a.pair.length===2&&['S','A'].includes(a.relation);if(section==='E')return !!a.text.trim()&&(!qs[i].extra||!!a.word);return !!a;}
function isCorrect(i){const q=qs[i],a=state.answers[i];if(section==='A')return a.length===2&&q.answer.every(v=>a.includes(v));if(section==='B')return a===q.answer;if(section==='D')return a.pair.length===2&&q.pair.every(v=>a.pair.includes(v))&&a.relation===q.relation;return false;}
function markChanged(i){if(state.review.checksUsed>0){state.review.statuses[i]='';state.review.revised[i]=true;}hideIncompleteWarning();save();paintStatus(i);updateProgress();}
function setAnswer(i,value){state.answers[i]=value;markChanged(i);renderCard(i);}
function paintStatus(i){const node=$('q'+i);if(!node)return;const wrap=node.querySelector('.review-status');if(!wrap)return;const s=state.review.statuses[i];node.classList.toggle('answered',isAnswered(i));node.classList.toggle('is-correct',s==='correct');node.classList.toggle('needs-review',s==='attention');node.classList.toggle('unanswered-review',s==='unanswered');wrap.innerHTML='';let label='';if(s==='correct')label='✅ Correct';else if(s==='attention')label='💡 Needs another look. '+(qs[i].hint||'Review the word meaning.');else if(s==='unanswered')label='○ Unanswered';else if(state.review.revised[i])label='✎ Changed since your last check';if(!label)return;
 let sp=elem('span','',label);wrap.append(sp);let play=elem('button','status-listen','🔊');play.type='button';play.setAttribute('aria-label','Read review note');play.onclick=()=>speak(label);wrap.append(play);}
function updateProgress(){const count=qs.filter((_,i)=>isAnswered(i)).length;$('progressText').textContent=count+' of '+qs.length+' answered';$('progressPips').querySelectorAll('.pip').forEach((e,i)=>e.classList.toggle('done',isAnswered(i)));if($('checkBtn'))updateCheckPanel();}
function updateCheckPanel(){if(!['A','B','D'].includes(section))return;const used=state.review.checksUsed;const allCorrect=state.review.statuses.length===qs.length&&state.review.statuses.every(s=>s==='correct');$('checksRemaining').textContent=allCorrect?'All responses verified. ✅':used>=MAX_CHECKS?'All 3 checks used · you may still edit and export.':(MAX_CHECKS-used)+' of '+MAX_CHECKS+' checks remaining';$('checkBtn').disabled=used>=MAX_CHECKS||allCorrect;}
function showWarning(missing){$('incompleteWarning').classList.add('show');$('incompleteText').textContent='Questions '+missing.map(i=>i+1).join(', ')+' are not finished. Checking anyway will use one of your three checks.';}
function hideIncompleteWarning(){if($('incompleteWarning'))$('incompleteWarning').classList.remove('show');}
function requestCheck(){if(state.review.checksUsed>=MAX_CHECKS)return;let missing=qs.map((q,i)=>i).filter(i=>!isAnswered(i));if(missing.length){showWarning(missing);return;}checkAll();}
function checkAll(){if(state.review.checksUsed>=MAX_CHECKS)return;state.review.checksUsed++;state.review.statuses=qs.map((q,i)=>!isAnswered(i)?'unanswered':isCorrect(i)?'correct':'attention');state.review.revised=qs.map(()=>false);hideIncompleteWarning();save();qs.forEach((q,i)=>paintStatus(i));updateProgress();}
function resetAll(){const b=$('clearBtn');if(b.dataset.confirm!=='yes'){b.dataset.confirm='yes';b.textContent='⚠️ Tap again to clear everything';setTimeout(()=>{if(b.dataset.confirm==='yes'){b.dataset.confirm='';b.textContent='🗑️ Clear all responses';}},4000);return;}cancelSpeak();try{localStorage.removeItem(storageKey);}catch(e){}location.reload();}
function finishCard(card,i){const s=elem('div','review-status');s.setAttribute('aria-live','polite');card.append(s);return card;}
function refreshCard(i){const target=$('q'+i);if(!target)return;let newCard=buildCard(i);target.replaceWith(newCard);paintStatus(i);updateProgress();}
function renderCard(i){refreshCard(i);}
function speakCurrentSentence(i){if(section==='B'){const q=qs[i];speak(q.before+(state.answers[i]||q.phrase)+q.after);}}
function buildCard(i){if(section==='A')return cardA(i);if(section==='B')return cardB(i);if(section==='C')return cardC(i);if(section==='D')return cardD(i);return cardE(i);}
function defaultCard(i){const card=elem('article','question-card');card.id='q'+i;const top=elem('div','card-top');top.append(elem('div','qnum',String(i+1)));const body=elem('div','card-body');top.append(body);card.append(top);return {card,body,top};}
function btnPlay(speech,label){const b=elem('button','play-btn','▶');b.type='button';b.setAttribute('aria-label',label||'Read aloud');b.onclick=()=>speak(typeof speech==='function'?speech():speech);return b;}
function makeInstructions(){const b=$('directions');b.textContent='🔊 '+D.directions;b.onclick=()=>speak(D.directions);}
function init(){renderBank($('wordBank'));makeInstructions();$('speakingToast').onclick=cancelSpeak;$('closeDefinition').onclick=()=>{$('definitionDialog').close();cancelSpeak();};$('definitionDialog').addEventListener('click',e=>{if(e.target===$('definitionDialog')){$('definitionDialog').close();cancelSpeak();}});$('definitionDialog').addEventListener('close',cancelSpeak);$('clearBtn').onclick=resetAll;$('exportBtn').onclick=exportPrint;
 for(let i=0;i<qs.length;i++){$('questionList').append(buildCard(i));const pip=elem('span','pip');pip.title='Question '+(i+1);$('progressPips').append(pip);}
 qs.forEach((q,i)=>paintStatus(i));updateProgress();if($('checkBtn')){$('checkBtn').onclick=requestCheck;$('keepWorking').onclick=hideIncompleteWarning;$('checkAnyway').onclick=checkAll;}if(section==='E')initEChoices();}
function printableShell(title,body){return '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{max-width:820px;margin:26px auto;padding:0 20px;font:15px/1.56 Arial,sans-serif;color:#182332}h1{font-size:22px;margin-bottom:4px}h2{font-size:19px}.name-line{display:flex;gap:25px;flex-wrap:wrap;margin:12px 0 20px}.line{display:inline-block;min-width:155px;border-bottom:1px solid #333}.print-q{margin:13px 0;break-inside:avoid}.source{margin-top:28px;font-size:11px;color:#555}.response{white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px solid #aaa;padding:6px 0;min-height:43px}.original{font-size:12px;color:#666;margin:4px 0}.story p{margin:10px 0}.print-header{font-weight:bold}button{padding:8px 16px}@media print{button{display:none}@page{margin:.68in}body{margin:0;padding:0}}</style></head><body><button onclick="window.print()">Print / Save as PDF</button><h1>'+esc(title)+'</h1><div class="name-line"><span>Name: <b class="line">Tina #14</b></span></div>'+body+'<p class="source">Wordly Wise 3000 · Book 6 · Lesson 5</p></body></html>';}
function exportPrint(){let body='<p class="print-header">'+esc(D.directions)+'</p>';qs.forEach((q,i)=>{const a=state.answers[i];body+='<section class="print-q"><p><b>'+(i+1)+'.</b> ';
 if(section==='A'){body+=q.phrases.map((p,k)=>'('+letters[k]+') '+esc(p)).join('　')+'</p><p><b>Sentence:</b> '+esc(buildPairSentence(q,a))+'</p>';}
 if(section==='B'){body+=esc(q.before)+'<strong>'+esc(q.phrase)+'</strong>'+esc(q.after)+'</p><p><b>Replacement:</b> '+esc(a||'________________')+'</p><p>'+esc(q.before+(a||'_____')+q.after)+'</p>';}
 if(section==='C'){body+=esc(q.question)+'</p><p>'+q.choices.map((c,k)=>'('+letters[k]+') '+esc(c)).join('　')+'</p><p><b>Selected:</b> '+(a.length?a.map(k=>'('+k+') '+esc(q.choices[letters.indexOf(k)])).join('; '):'________')+'</p>';}
 if(section==='D'){body+=q.words.map(esc).join(' · ')+'</p><p><b>Selected:</b> '+(a.pair.length?a.pair.map(k=>esc(q.words[k])).join(' + '):'________')+'　<b>Type:</b> '+(a.relation==='S'?'Synonyms':a.relation==='A'?'Antonyms':'________')+'</p>';}
 if(section==='E'){body+=esc(q.text)+'</p>'+(q.extra&&a.word?'<p class="original">Vocabulary: '+esc(a.word==='__different__'?'Chosen in written response':D.eCandidates.find(x=>x[0]===a.word)?.[1]||a.word)+'</p>':'')+'<div class="response">'+(a.text.trim()?esc(a.text):'&nbsp;')+'</div>';}
 body+='</section>';});if(section==='E'){const story='<h2>'+esc(D.storyTitle)+'</h2><div class="story">'+D.paragraphs.map(p=>'<p>'+p.map(esc).join(' ')+'</p>').join('')+'</div><h2>Questions</h2>';body=story+body;}
 const file=printableShell('Wordly Wise Lesson 5'+section+' · '+D.title,body);const url=URL.createObjectURL(new Blob([file],{type:'text/html;charset=utf-8'}));const a=elem('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}

function buildPairSentence(q,selected){if(!Array.isArray(selected)||selected.length!==2)return '';
 const candidates=selected.map(k=>({key:k,txt:q.phrases[letters.indexOf(k)]}));
 candidates.sort((a,b)=>{const endA=/[.?!]$/.test(a.txt),endB=/[.?!]$/.test(b.txt);if(endA!==endB)return endA?1:-1;return letters.indexOf(a.key)-letters.indexOf(b.key);});
 return candidates.map(x=>x.txt).join(' ').replace(/\s+/g,' ').trim();}
function cardA(i){const q=qs[i],a=state.answers[i];const {card,body,top}=defaultCard(i);top.append(btnPlay(()=>buildPairSentence(q,state.answers[i])||q.phrases.map((x,j)=>'Option '+letters[j]+'. '+x).join(' '),'Read chosen sentence or all options'));
 const opts=elem('div','choices');q.phrases.forEach((phrase,j)=>{const id=letters[j],row=elem('div','choice-row');const select=elem('button','choose-btn'+(a.includes(id)?' selected':''),id);select.type='button';select.disabled=a.length===2&&!a.includes(id);select.setAttribute('aria-pressed',String(a.includes(id)));select.setAttribute('aria-label',(a.includes(id)?'Deselect':'Select')+' phrase '+id);select.onclick=()=>{const next=a.includes(id)?a.filter(x=>x!==id):a.length<2?[...a,id]:a;if(next.length===a.length&&next.every((v,k)=>v===a[k]))return;setAnswer(i,next);if(next.length===2)setTimeout(()=>speak(buildPairSentence(q,next)),300);};
 const read=elem('button','choice-read','🔊 '+phrase);read.type='button';read.onclick=()=>speak(phrase);row.append(select,read);opts.append(row);});body.append(opts);
 const current=buildPairSentence(q,a);const as=elem('div','assembled'+(current?'':' empty'),current||'The sentence will appear here after you choose two phrases.');body.append(as);return finishCard(card,i);}
function cardB(i){const q=qs[i],a=state.answers[i],hinted=state.hinted[i];const {card,body,top}=defaultCard(i);
 const tools=elem('div','card-tools');tools.append(btnPlay(()=>q.before+(state.answers[i]||q.phrase)+q.after,'Read full sentence'));const hint=elem('button','hint-btn'+(hinted?' active':''),'💡');hint.type='button';hint.setAttribute('aria-label','Show part-of-speech hint');hint.onclick=()=>{if(!hinted){state.hinted[i]=true;save();renderCard(i);}};tools.append(hint);top.append(tools);
 const preview=elem('div','phrase-replacement readable');preview.tabIndex=0;preview.setAttribute('role','button');preview.setAttribute('aria-label','Read current sentence');const target=a?'<span class="selected-target">'+esc(a)+'</span>':'<span class="phrase-target'+(hinted?' hint-pos-'+q.pos:'')+'">'+esc(q.phrase)+'</span>';preview.innerHTML=esc(q.before)+target+esc(q.after);preview.onclick=()=>speak(q.before+(state.answers[i]||q.phrase)+q.after);preview.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();preview.click();}};body.append(preview);
 const wrap=elem('div','answer-area');const label=elem('label','', 'Replace the bold phrase');label.htmlFor='sel'+i;label.style.fontWeight='900';label.style.color='var(--blue-dark)';wrap.append(label);
 const sel=elem('select','answer-select');sel.id='sel'+i;let blank=elem('option','','— choose a word —');blank.value='';sel.append(blank);D.bChoices.filter(x=>!hinted||x[1]===q.pos||x[0]===a).forEach(([form,pos,family])=>{const option=elem('option','',form+' · '+(posAbbr[pos]||pos));option.value=form;sel.append(option);});sel.value=a;sel.onchange=()=>{const val=sel.value;setAnswer(i,val);if(val)setTimeout(()=>speak(q.before+val+q.after),300);};wrap.append(sel);body.append(wrap);
 if(hinted){const note=elem('p','phrase-note','💡 Part of speech: '+q.pos);body.append(note);}if(a){body.append(elem('p','phrase-note','Original bold phrase: '+q.phrase));}
 return finishCard(card,i);}
function cardC(i){const q=qs[i],a=state.answers[i];const {card,body,top}=defaultCard(i);top.append(btnPlay(q.question,'Read question'));
 const title=elem('div','question-prompt readable');title.innerHTML=htmlWithVocab(q.question);title.tabIndex=0;title.setAttribute('role','button');title.onclick=()=>speak(q.question);title.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(q.question);}};body.append(title);attachVocabClicks(title);
 const opts=elem('div','choices');q.choices.forEach((phrase,j)=>{const id=letters[j],row=elem('div','choice-row');const check=elem('button','choose-btn'+(a.includes(id)?' selected':''),a.includes(id)?'☑':'☐');check.type='button';check.setAttribute('aria-pressed',String(a.includes(id)));check.setAttribute('aria-label',(a.includes(id)?'Deselect':'Select')+' option '+id);check.onclick=()=>setAnswer(i,a.includes(id)?a.filter(x=>x!==id):[...a,id]);const read=elem('button','choice-read','('+id+') 🔊 '+phrase);read.type='button';read.onclick=()=>speak(phrase);row.append(check,read);opts.append(row);});body.append(opts);return finishCard(card,i);}
function cardD(i){const q=qs[i],a=state.answers[i];const {card,body}=defaultCard(i);const opts=elem('div','choices');q.words.forEach((word,j)=>{const row=elem('div','choice-row'),selected=a.pair.includes(j);const check=elem('button','choose-btn'+(selected?' selected':''),selected?'☑':'☐');check.type='button';check.setAttribute('aria-pressed',String(selected));check.setAttribute('aria-label',(selected?'Deselect':'Select')+' '+word);check.disabled=a.pair.length===2&&!selected;check.onclick=()=>{const p=selected?a.pair.filter(x=>x!==j):a.pair.length<2?[...a.pair,j]:a.pair;setAnswer(i,{pair:p,relation:a.relation});};const read=elem('button','choice-read','🔊 '+word);read.type='button';read.onclick=()=>openDefinition(word,true);row.append(check,read);opts.append(row);});body.append(opts);
 const r=elem('div','relation-row');r.append(elem('div','pair-label','These two words are…'));[['S','S · Synonyms'],['A','A · Antonyms']].forEach(([code,txt])=>{const b=elem('button','relation-btn'+(a.relation===code?' active':''),txt);b.type='button';b.setAttribute('aria-pressed',String(a.relation===code));b.onclick=()=>setAnswer(i,{pair:a.pair,relation:a.relation===code?'':code});r.append(b);});body.append(r);return finishCard(card,i);}
const allForms=Object.keys(D.vocabForms||{}).sort((a,b)=>b.length-a.length);
const vocabRE=new RegExp('\\b('+allForms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
function htmlWithVocab(str){let out='',last=0,match;vocabRE.lastIndex=0;while((match=vocabRE.exec(str))!==null){out+=esc(str.slice(last,match.index));out+='<button type="button" class="vocab-inline" data-vocab="'+esc(match[0].toLowerCase())+'" aria-label="Definition of '+esc(match[0])+'">'+esc(match[0])+'</button>';last=vocabRE.lastIndex;}return out+esc(str.slice(last));}
function attachVocabClicks(root){root.querySelectorAll('.vocab-inline').forEach(b=>{b.onclick=e=>{e.stopPropagation();openDefinition(b.dataset.vocab,true);};b.onkeydown=e=>e.stopPropagation();});}
function renderStory(){const container=$('storyContent');if(!container)return;container.innerHTML='';D.paragraphs.forEach((p,i)=>{const row=elem('div','paragraph-card');const full=p.join(' ');row.append(btnPlay(full,'Read paragraph '+(i+1)));const content=elem('div','paragraph-text');p.forEach((s,k)=>{const span=elem('span','sentence-tap');span.setAttribute('role','button');span.tabIndex=0;span.title='Tap to hear this sentence';span.innerHTML=htmlWithVocab(s);span.onclick=()=>speak(s);span.onkeydown=e=>{if(e.target!==span)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(s);}};content.append(span,document.createTextNode(' '));attachVocabClicks(span);});row.append(content);container.append(row);});}
function cardE(i){const q=qs[i],a=state.answers[i];const {card,body,top}=defaultCard(i);top.append(btnPlay(q.text,'Read question'));
 const prompt=elem('div','question-prompt readable');prompt.innerHTML=htmlWithVocab(q.text);prompt.setAttribute('role','button');prompt.tabIndex=0;prompt.onclick=()=>speak(q.text);prompt.onkeydown=e=>{if(e.target===prompt&&(e.key==='Enter'||e.key===' ')){e.preventDefault();speak(q.text);}};body.append(prompt);attachVocabClicks(prompt);
 if(q.extra){const wc=elem('div','vocab-choice');const label=elem('label','vocab-label','Vocabulary word for this answer');label.htmlFor='vocab-select-'+i;const sel=elem('select','vocab-select');sel.id='vocab-select-'+i;sel.setAttribute('aria-label','Choose an unused Word List 5 word for question '+(i+1));sel.onchange=()=>{state.answers[i].word=sel.value;save();refreshEChoices();updateProgress();paintStatus(i);if(sel.value)speak(sel.value==='__different__'?'Choose a different word from the lesson word list.':D.eCandidates.find(x=>x[0]===sel.value)?.[1]||sel.value);};
 const def=elem('button','vocab-def-btn','📖 Definition');def.type='button';def.id='vocab-def-'+i;def.onclick=()=>{if(state.answers[i].word&&state.answers[i].word!=='__different__')openDefinition(state.answers[i].word);};wc.append(label,sel,def);body.append(wc);body.append(elem('p','vocab-note','Choose one unused lesson word, then use that word or a related form in your sentence. You can also choose a different word.'));}
 const taLabel=elem('label','answer-label','Your sentence');taLabel.htmlFor='answer-'+i;body.append(taLabel);const ta=elem('textarea','answer-textarea');ta.id='answer-'+i;ta.rows=3;ta.value=a.text;ta.placeholder='Write your answer in a sentence…';ta.setAttribute('aria-label','Your answer to question '+(i+1));ta.oninput=()=>{state.answers[i].text=ta.value;save();updateProgress();paintStatus(i);};body.append(ta);
 const read=elem('button','read-answer','▶ Read my answer');read.type='button';read.onclick=()=>speak(ta.value||'No answer written yet.');body.append(read);return finishCard(card,i);}
function refreshEChoices(){if(section!=='E')return;qs.forEach((q,i)=>{if(!q.extra)return;const sel=$('vocab-select-'+i);if(!sel)return;const selected=state.answers[i].word;sel.innerHTML='';const placeholder=elem('option','','— choose unused word —');placeholder.value='';sel.append(placeholder);D.eCandidates.forEach(([family,label])=>{const elsewhere=state.answers.some((a,j)=>j!==i&&qs[j].extra&&a.word===family);if(elsewhere&&selected!==family)return;const o=elem('option','',label);o.value=family;sel.append(o);});const other=elem('option','','Choose a different word…');other.value='__different__';sel.append(other);sel.value=selected||'';const def=$('vocab-def-'+i);if(def){def.disabled=!selected||selected==='__different__';def.textContent=selected&&selected!=='__different__'?'📖 '+(D.eCandidates.find(x=>x[0]===selected)?.[1]||selected):'📖 Definition';}});}
function initEChoices(){if(section!=='E')return;renderStory();refreshEChoices();}
init();
</script></body></html>
