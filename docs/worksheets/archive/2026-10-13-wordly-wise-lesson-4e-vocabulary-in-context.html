const entries=[{"word":"aloft","paragraphs":[{"label":"aloft · adverb","definition":"Up in the air, especially in flight.","example":"A strong breeze kept the kites aloft."}]},{"word":"attain","paragraphs":[{"label":"attain · verb · 1","definition":"To reach; to arrive at.","example":"Redwood trees attain heights of over three hundred feet."},{"label":"attain · verb · 2","definition":"To achieve.","example":"DeShawn attained his goal of getting straight A’s on his report card."}]},{"word":"buffet","paragraphs":[{"label":"buffet · noun · 1","definition":"A piece of furniture with drawers and shelves for the storage and display of plates, dishes, and bowls.","example":"This splendid antique buffet contains a valuable collection of china."},{"label":"buffet · noun · 2","definition":"A meal laid out for guests to help themselves.","example":"The abundance of food at the buffet allowed people to go back for second or third helpings."},{"label":"buffet · verb","definition":"To pound repeatedly; to batter.","example":"High winds and waves buffeted the ship during the storm."}]},{"word":"elude","paragraphs":[{"label":"elude · verb","definition":"To escape by being quick or clever.","example":"The mouse eluded the cat by slipping through a crack in the wall."},{"label":"elusive · adjective · 1","definition":"Hard to find or capture.","example":"The elusive eagle flew above the pine trees before disappearing again."},{"label":"elusive · adjective · 2","definition":"Hard to explain or make clear.","example":"Albert Einstein’s connection between energy and the speed of light is too elusive for most nonscientists to grasp."}]},{"word":"flammable","paragraphs":[{"label":"flammable · adjective","definition":"Able to catch fire easily.","example":"Building materials must be fireproofed so they are not flammable."}]},{"word":"hover","paragraphs":[{"label":"hover · verb","definition":"To remain in place over an object or location.","example":"Hummingbirds hover by beating their wings sixty times a second."}]},{"word":"inflate","paragraphs":[{"label":"inflate · verb","definition":"To fill with air or other gas.","example":"Inflate your bike tires to the correct pressure."}]},{"word":"jeopardy","paragraphs":[{"label":"jeopardy · noun","definition":"Danger.","example":"Mountaineers who climb without partners put their lives in jeopardy."},{"label":"jeopardize · verb","definition":"To put in danger of loss or injury.","example":"Bikers jeopardize their safety by riding without a helmet."}]},{"word":"moor","paragraphs":[{"label":"moor · verb","definition":"To hold in place with ropes or anchors.","example":"After the sailors moored the boat to the dock, they went ashore."},{"label":"mooring · noun","definition":"A place to which a boat or aircraft can be moored.","example":"The hurricane tore many boats from their moorings."}]},{"word":"plummet","paragraphs":[{"label":"plummet · verb","definition":"To fall suddenly toward the earth or to a lower level; to plunge.","example":"We tried not to panic as the apartment elevator plummeted to the basement."}]},{"word":"pollute","paragraphs":[{"label":"pollute · verb","definition":"To make impure or dirty.","example":"Teachers help keep your mind from being polluted by incorrect information."},{"label":"pollution · noun","definition":"The action of polluting; the state of being polluted.","example":"The careless dumping of poisonous chemicals caused widespread pollution of the soil."}]},{"word":"propel","paragraphs":[{"label":"propel · verb","definition":"To push or drive forward.","example":"Two engines propelled the speedboat."}]},{"word":"stationary","paragraphs":[{"label":"stationary · adjective · 1","definition":"Not moving.","example":"A stationary bicycle is used for exercise."},{"label":"stationary · adjective · 2","definition":"Not changing.","example":"The price of admission to the ballpark has remained stationary for the past couple of years."}]},{"word":"superb","paragraphs":[{"label":"superb · adjective","definition":"Of the highest quality; grand; splendid.","example":"The view from the mountaintop was superb."}]},{"word":"swivel","paragraphs":[{"label":"swivel · noun","definition":"A fastening that allows any part joined to it to swing freely.","example":"This chair has a swivel that enables it to turn in a full circle."},{"label":"swivel · verb","definition":"To turn freely around a fixed point.","example":"Owls can swivel their heads to look behind them."}]}];
const forms={"aloft":"aloft","attain":"attain","attained":"attain","attainment":"attain","buffet":"buffet","buffeted":"buffet","buffeting":"buffet","elude":"elude","eluded":"elude","elusive":"elude","flammable":"flammable","hover":"hover","hovered":"hover","hovering":"hover","inflate":"inflate","inflated":"inflate","jeopardy":"jeopardy","jeopardize":"jeopardy","jeopardized":"jeopardy","moor":"moor","moored":"moor","mooring":"moor","moorings":"moor","plummet":"plummet","plummeted":"plummet","plummeting":"plummet","pollute":"pollute","pollution":"pollute","polluted":"pollute","propel":"propel","propelled":"propel","stationary":"stationary","superb":"superb","swivel":"swivel","swivels":"swivel","swiveling":"swivel"};
const POS_META={noun:{short:'n',cls:'pos-noun'},verb:{short:'v',cls:'pos-verb'},adjective:{short:'adj',cls:'pos-adjective'},adverb:{short:'adv',cls:'pos-adverb'}};
function speak(t){if(!t||!('speechSynthesis' in window))return;cancelSpeak();let u=new SpeechSynthesisUtterance(t);u.rate=.88;u.pitch=1.05;u.onstart=()=>$('speakingToast').classList.add('visible');u.onend=u.onerror=()=>$('speakingToast').classList.remove('visible');speechSynthesis.speak(u);}
function cancelSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();$('speakingToast').classList.remove('visible');}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getFamily(word){return forms[String(word).toLowerCase()]||null;}
function parseLabel(t){let a=t.split('·').map(s=>s.trim());return{head:a[0]||'',pos:(a[1]||'').toLowerCase(),sense:a[2]||''};}

function openDefinition(word,readWord=false){const family=getFamily(word)||word;const ent=entries.find(x=>x.word===family);if(!ent)return false;cancelSpeak();$('definitionTitle').textContent=ent.word;$('definitionBody').replaceChildren();for(const p of ent.paragraphs){let info=parseLabel(p.label),row=document.createElement('article');row.className='definition-card';let play=document.createElement('button');play.className='definition-read-btn';play.textContent='▶';play.setAttribute('aria-label','Read definition and example aloud');play.onclick=()=>speak(info.head+'. '+info.pos+'. '+(info.sense?'Sense '+info.sense+'. ':'')+'Definition: '+p.definition+' Example: '+p.example);let content=document.createElement('div');content.className='definition-card-content';let label=document.createElement('div');label.className='definition-label';let head=document.createElement('span');head.className='definition-headword';head.textContent=info.head;label.append(head,posTag(info.pos));if(info.sense){let n=document.createElement('span');n.className='definition-sense';n.textContent='sense '+info.sense;label.append(n);}content.append(label);for(const [key,value,extra] of [['Definition',p.definition,''],['Example',p.example,' definition-example']]){let part=document.createElement('div');part.className='definition-part'+extra;let kind=document.createElement('div');kind.className='definition-kind';kind.textContent=key;let copy=document.createElement('div');copy.className='definition-copy';copy.textContent=value;part.append(kind,copy);content.append(part);}row.append(play,content);$('definitionBody').append(row);} $('readWord').onclick=()=>speak(String(word));$('definitionDialog').showModal();if(readWord)speak(String(word));return true;}
function renderBank(target){entries.forEach(ent=>{let b=document.createElement('button');b.className='bank-word';let word=document.createElement('span');word.textContent=ent.word;b.append(word);let poss=new Set(ent.paragraphs.map(p=>parseLabel(p.label).pos));let tags=document.createElement('span');tags.className='bank-pos-list';poss.forEach(pos=>tags.append(posTag(pos)));b.append(tags);b.onclick=()=>openDefinition(ent.word);target.append(b);});}
function makeChip(word){const b=document.createElement('button');b.className='vocab-chip';b.textContent=word;b.title='Tap for lesson definition';b.setAttribute('aria-label','Definition of '+word);b.onclick=e=>{e.stopPropagation();openDefinition(word,true);};return b;}
function addVocabText(container,text){let regex=/\b[A-Za-z]+(?:[’'][A-Za-z]+)?\b/g,m,last=0;while((m=regex.exec(text))){if(m.index>last)container.append(document.createTextNode(text.slice(last,m.index)));let word=m[0];if(getFamily(word))container.append(makeChip(word));else container.append(document.createTextNode(word));last=regex.lastIndex;}if(last<text.length)container.append(document.createTextNode(text.slice(last)));}
function addPrompt(container,text){let s=document.createElement('span');s.className='question-tap';s.setAttribute('role','button');s.tabIndex=0;s.setAttribute('aria-label','Read prompt');s.onclick=()=>speak(text);s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(text);}};addVocabText(s,text);container.append(s);}
function makeCardHeading(i,text,readText){let head=document.createElement('div');head.className='card-head';let number=document.createElement('span');number.className='qnum';number.textContent=(i+1)+'.';let prompt=document.createElement('div');prompt.className='question-text';addPrompt(prompt,text);let play=document.createElement('button');play.className='play-btn';play.textContent='▶';play.setAttribute('aria-label','Read question '+(i+1));play.onclick=()=>speak(readText||text);head.append(number,prompt,play);return head;}
function loadState(key,fallback,validator){try{const r=JSON.parse(localStorage.getItem(key)||'null');return validator(r)?r:fallback;}catch(e){return fallback;}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('saveStatus').textContent='Saved on this device';}catch(e){$('saveStatus').textContent='Autosave unavailable. Export / Print keeps a copy.';}}
function wireFooter(){ $('speakingToast').onclick=cancelSpeak;$('definitionDialog').addEventListener('click',e=>{if(e.target===$('definitionDialog')){cancelSpeak();$('definitionDialog').close();}});$('closeDefinition').onclick=()=>{cancelSpeak();$('definitionDialog').close();};$('clearBtn').onclick=()=>{const b=$('clearBtn');if(b.dataset.confirming==='true'){cancelSpeak();try{localStorage.removeItem(STORAGE_KEY);}catch(e){}location.reload();}else{b.dataset.confirming='true';b.classList.add('confirming');b.textContent='⚠️ Tap again to confirm';setTimeout(()=>{if(b.dataset.confirming==='true'){b.dataset.confirming='false';b.classList.remove('confirming');b.textContent='🗑️ Clear all responses';}},3000);}}; $('exportBtn').onclick=exportPrint;}
function paintProgress(complete){let done=0;for(let i=0;i<complete.length;i++){let yes=Boolean(complete[i]);if(yes)done++;$('pip-'+i).classList.toggle('done',yes);$('card-'+i).classList.toggle('answered',yes);}$('progressCount').textContent=done+' / '+complete.length+' answered';}
function addPips(n){for(let i=0;i<n;i++){let e=document.createElement('span');e.id='pip-'+i;e.className='pip';$('progressPips').append(e);}}
function printWindow(inner,title){let date=new Date().toLocaleDateString('en-US');const html='<!doctype html><html lang="en"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{max-width:790px;margin:25px auto;padding:0 22px;font:15px/1.5 Arial,sans-serif;color:#172332}h1{font-size:23px;margin-bottom:6px}h2{font-size:19px}button{padding:10px 15px}.name-line{display:flex;align-items:flex-end;gap:26px;margin:14px 0 22px}.name-line span{display:inline-flex;align-items:flex-end;gap:8px}.line{border-bottom:1px solid #333;min-width:150px}.q{margin:14px 0;break-inside:avoid}.q p{margin:5px 0}.answer{white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px solid #999;min-height:44px;padding:4px 0}.story p{margin:11px 0}.choice{display:block;margin:4px 0}.footer{font-size:11px;color:#666;margin-top:35px}@media print{button{display:none}body{margin:0;padding:0}@page{margin:.63in}}</style></head><body><button onclick="window.print()">Print / Save as PDF</button><h1>'+esc(title)+'</h1><div class="name-line"><span>Name: <b class="line">Tina #18</b></span><span>Date: <span class="line">'+esc(date)+'</span></span></div>'+inner+'<div class="footer">Wordly Wise 3000 · Book 6 · Lesson 4</div></body></html>';let u=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);}
const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;
function startMic(i){let status=$('mic-status-'+i),btn=$('mic-'+i),ta=$('answer-'+i);if(!SpeechRecognitionCtor){status.textContent='Speech input is unavailable here. Typing still works.';return;}let rec=new SpeechRecognitionCtor();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;btn.classList.add('listening');status.textContent='Listening…';rec.onresult=e=>{let words=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();ta.value=(ta.value.trim()?ta.value.trimEnd()+' ':'')+words;ta.dispatchEvent(new Event('input',{bubbles:true}));status.textContent='Dictation added';};rec.onerror=e=>{status.textContent='Microphone unavailable here. Typing still works.';};rec.onend=()=>{btn.classList.remove('listening');if(status.textContent==='Listening…')status.textContent='Mic stopped';};try{rec.start();}catch(e){btn.classList.remove('listening');status.textContent='Microphone unavailable here. Typing still works.';}}
function answerEditor(i,value,update){let box=document.createElement('div');let label=document.createElement('label');label.className='answer-label';label.htmlFor='answer-'+i;label.textContent='Your answer';let ta=document.createElement('textarea');ta.id='answer-'+i;ta.className='answer-textarea';ta.value=value||'';ta.setAttribute('aria-label','Your answer to question '+(i+1));ta.addEventListener('input',()=>update(ta.value));let actions=document.createElement('div');actions.className='answer-actions';let read=document.createElement('button');read.className='read-answer';read.id='read-answer-'+i;read.textContent='▶ Read my answer';read.disabled=!ta.value.trim();read.onclick=()=>speak(ta.value);const mic=document.createElement('button');mic.className='mic-btn';mic.id='mic-'+i;mic.textContent='🎤 Dictate';mic.setAttribute('aria-label','Dictate answer to question '+(i+1));mic.onclick=()=>startMic(i);if(!SpeechRecognitionCtor){mic.disabled=true;mic.title='Speech recognition not supported by this browser';}let status=document.createElement('span');status.id='mic-status-'+i;status.className='mic-note';status.setAttribute('aria-live','polite');actions.append(read,mic,status);box.append(label,ta,actions);return box;}


const STORAGE_KEY='worksheet_wordly_wise_lesson_4e_2026_10_13_v1';
const questions=[{"text":"Give two reasons why helium is used to fill a blimp’s envelope."},{"text":"For how long does the blimp’s envelope remain inflated?","vocab":"inflated"},{"text":"What is the meaning of elusive as it is used in the passage?","vocab":"elusive"},{"text":"What would happen to the gondola if it became separated from the envelope while the blimp was in flight?"},{"text":"What is the meaning of stationary as it is used in the passage?","vocab":"stationary"},{"text":"How can blimps be of use in scientific studies of the air?"},{"text":"What is the purpose of the swivel to which a blimp is attached?","vocab":"swivel"},{"text":"Why does a blimp need to be moored when not flying?","vocab":"moored"},{"text":"Why does a blimp’s movement not depend on the direction of the wind?"},{"text":"What is the meaning of attain as it is used in the passage?","vocab":"attain"},{"text":"How could bad weather jeopardize a planned trip in a blimp?","vocab":"jeopardize"},{"text":"Are engines essential to keep a blimp in the air? Why or why not?"},{"text":"Why do some advertisers think a blimp is a superb way to get their message across?","vocab":"superb"}];
const paragraphs=[["Billboards standing along the highway are easily ignored, but a two-hundred-foot billboard floating across the sky grabs everyone’s attention.","That’s why blimps are so attractive to advertisers with a product to sell or a message to communicate.","But advertising is only one of the uses for a blimp."],["Blimps can be moved easily to different locations at varying altitudes.","This makes them useful for a variety of purposes.","Scientists use blimps for collecting samples used in the study of air pollution; the United States Navy employs them for offshore patrols; and one was even used to search for the elusive Loch Ness monster, supposed to inhabit a lake in Scotland."],["The main body of the blimp is a large bag, called the envelope.","It is inflated with helium gas.","The blimp stays aloft because helium is seven times lighter than air.","Once inside the envelope, the helium is left there unless the blimp needs major repairs.","After the envelope has been filled, a cabin called a gondola is attached under it; this is where the crew and passengers ride.","It is also where the light panels used for advertisements are attached.","Computer graphics provide a dazzling display of pictures and words that can’t be matched by any billboard."],["Blimps are propelled by two engines, one on each side, and can attain a top speed of about forty miles an hour.","Although slow in comparison to airplanes, blimps can do something most planes cannot: They can stop and hover in midair.","This ability enables them to provide a stationary platform for the television cameras covering sporting events, giving viewers a bird’s-eye view of the action."],["Blimps are not designed to take a buffeting from high winds, though.","They usually can go up only when the air is calm.","When not flying, they have to be moored by the front end to a tall mast on a truck specially equipped for this purpose.","Plenty of space is needed because the blimp has to be free to swivel clear of the ground when the wind changes."],["In some cities it is possible to buy a ticket and go on a sightseeing trip in a blimp; because blimps fly so slowly and at such a low altitude, those on board enjoy superb views of the ground below.","You might wonder what would happen if the envelope got a small hole in it.","Would the helium rush out, causing the gondola to plummet to the ground?","Passengers need not worry about that; their lives would not be in jeopardy if such a thing happened.","Why?","The pressure of the air outside the envelope is greater than that of the helium inside.","Because of that, the helium doesn’t easily escape.","And because helium is not flammable, there is no danger of the envelope’s contents catching fire.","Flying in a blimp is safe and enjoyable."]];
const candidates=["aloft","buffet","flammable","hover","plummet","pollute","propel"];
const storyTitle='A Different Way to Fly';
const instruction="Answer each of the following questions with a sentence. If a question does not contain a vocabulary word from the lesson’s word list, use one in your answer. Use each word only once.";
let state=loadState(STORAGE_KEY,{answers:questions.map(()=>''),words:questions.map(()=>'')},s=>s&&Array.isArray(s.answers)&&s.answers.length===questions.length&&Array.isArray(s.words)&&s.words.length===questions.length);
function hasVocab(q){return Boolean(q.vocab);}
function updateProgress(){paintProgress(questions.map((q,i)=>Boolean(state.answers[i].trim())&&(hasVocab(q)||Boolean(state.words[i]))));questions.forEach((q,i)=>{$('read-answer-'+i).disabled=!state.answers[i].trim();});}
function renderStory(){paragraphs.forEach((sentences,i)=>{let card=document.createElement('article');card.className='story-card';let top=document.createElement('div');top.className='story-card-top';let label=document.createElement('span');label.className='story-card-title';label.textContent='Paragraph '+(i+1);let btn=document.createElement('button');btn.className='play-btn';btn.textContent='▶';btn.setAttribute('aria-label','Read paragraph '+(i+1));btn.onclick=()=>speak(sentences.join(' '));top.append(label,btn);let p=document.createElement('p');p.className='story-text';sentences.forEach((s,j)=>{let sp=document.createElement('span');sp.className='sentence-tap';sp.setAttribute('role','button');sp.tabIndex=0;sp.setAttribute('aria-label','Read sentence '+(j+1)+' in paragraph '+(i+1));sp.onclick=()=>speak(s);sp.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(s);}};addVocabText(sp,s);p.append(sp);if(j<sentences.length-1)p.append(document.createTextNode(' '));});card.append(top,p);$('story').append(card);});}
function refreshWordPickers(){questions.forEach((q,i)=>{if(hasVocab(q))return;let sel=$('select-word-'+i);if(!sel)return;let current=state.words[i],used=new Set(state.words.filter((w,idx)=>idx!==i&&w));sel.replaceChildren();let zero=new Option('— choose unused word —','');sel.append(zero);candidates.forEach(word=>{if(!used.has(word))sel.append(new Option(word,word));});if(current&&!candidates.includes(current))current='';sel.value=current;});}
function updateWord(i,v){state.words[i]=v;refreshWordPickers();saveState();updateProgress();if(v)speak(v);}
function renderQuestions(){questions.forEach((q,i)=>{let card=document.createElement('article');card.className='question-card';card.id='card-'+i;card.append(makeCardHeading(i,q.text));if(!hasVocab(q)){let box=document.createElement('div');box.className='word-select-box';let label=document.createElement('label');label.textContent='Word List 4 word for your answer';label.htmlFor='select-word-'+i;let row=document.createElement('div');row.className='word-select-row';let sel=document.createElement('select');sel.className='word-select';sel.id='select-word-'+i;sel.setAttribute('aria-label','Choose an unused word for question '+(i+1));sel.onchange=()=>updateWord(i,sel.value);let def=document.createElement('button');def.className='vocab-chip';def.textContent='📖 Definition';def.onclick=()=>{if(state.words[i])openDefinition(state.words[i]);};def.id='selected-definition-'+i;row.append(sel,def);let note=document.createElement('p');note.className='word-select-note';note.textContent='Use the word (or a related form) in your sentence.';box.append(label,row,note);card.append(box);}card.append(answerEditor(i,state.answers[i],v=>{state.answers[i]=v;saveState();updateProgress();}));$('questionsList').append(card);});addPips(questions.length);refreshWordPickers();updateProgress();}
function exportPrint(){let story='<h2>'+esc(storyTitle)+'</h2><div class="story">'+paragraphs.map(ss=>'<p>'+esc(ss.join(' '))+'</p>').join('')+'</div>';let qhtml=questions.map((q,i)=>'<div class="q"><p><strong>'+(i+1)+'.</strong> '+esc(q.text)+'</p>'+(!hasVocab(q)&&state.words[i]?'<p><strong>Word:</strong> '+esc(state.words[i])+'</p>':'')+'<div class="answer">'+esc(state.answers[i])+'</div></div>').join('');printWindow(story+'<h2>Questions</h2><p>'+esc(instruction)+'</p>'+qhtml,'Wordly Wise 4E · Vocabulary in Context');}
$('instructions').textContent='🔊 '+instruction;$('instructions').onclick=()=>speak(instruction);renderBank($('wordBank'));wireFooter();renderStory();renderQuestions();
</script></body></html>
