function qComplete(i){const a=state.answers[i];if(MODE==='a')return Array.isArray(a)&&a.length===2;if(MODE==='c')return Array.isArray(a)&&a.length>0;if(MODE==='e'){return Boolean(String(a||'').trim())&&(hasLessonWord(DATA.questions[i])||Boolean(state.choices[i]))}return Boolean(String(a||'').trim());}

$('definitionDlg').addEventListener('close',cancelSpeak);

document.addEventListener('click',e=>{const vocab=e.target.closest('[data-vocab]');if(vocab){openDefinition(vocab.dataset.vocab);return}const btn=e.target.closest('[data-action]');if(btn){const act=btn.dataset.action,i=Number(btn.dataset.i),v=btn.dataset.v;if(act==='closeDef'){$('definitionDlg').close();return}if(act==='closeBank'){$('bankDlg').close();return}if(act==='hintB'){if(!state.hinted[i]){state.hinted[i]=true;save();const card=$('card-'+i);const keepFocus=card.contains(document.activeElement);card.outerHTML=BCard(DATA.questions[i],i);if(keepFocus){const hint=$('card-'+i).querySelector('[data-action="hintB"]');if(hint)hint.focus({preventScroll:true});}}return}if(act==='chooseD'){openD(i);return}if(act==='openAllD'){openD(DATA.questions.findIndex((q,j)=>!state.answers[j])>=0?DATA.questions.findIndex((q,j)=>!state.answers[j]):0);return}if(act==='selectD'){const word=btn.dataset.w;const q=DATA.questions[activeD];const answer=/^[A-Z]/.test(q.answer)?word[0].toUpperCase()+word.slice(1):word;setAnswer(activeD,answer);$('bankDlg').close();render();const slot=document.querySelector('[data-action="chooseD"][data-i="'+activeD+'"]');if(slot)slot.focus({preventScroll:true});setTimeout(()=>speak(sentenceD(q,answer)),300);return}if(act==='pickA'){const a=state.answers[i].slice();const index=a.indexOf(v);if(index>=0)a.splice(index,1);else if(a.length<2)a.push(v);setAnswer(i,a);render();if(a.length===2)setTimeout(()=>speak(assembled(DATA.questions[i],a)),300);return}if(act==='pickC'){const a=state.answers[i].slice(),index=a.indexOf(v);if(index>=0)a.splice(index,1);else a.push(v);setAnswer(i,a);render();return}if(act==='readE'){speak(state.answers[i]||'No answer entered yet.');return}if(act==='mic'){toggleMic(i,btn);return}if(act==='check'){checkAll();return}if(act==='unlock'){const el=$('adultEntry');if(el)el.hidden=false;return}if(act==='grant'){if($('adultCode')?.value==='17931793'){state.grants++;save();render();status('One additional check unlocked.')}else status('Code not accepted.');return}if(act==='clear'){clearTwice();return}if(act==='print'){exportPrint();return}}
const voice=e.target.closest('[data-say]');if(voice){speak(voice.dataset.say);return}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target;if((el.hasAttribute('role')&&el.getAttribute('role')==='button')&&el.dataset.say&&!el.matches('button')){e.preventDefault();speak(el.dataset.say)}});
document.addEventListener('change',e=>{const b=e.target.dataset.b;if(b!==undefined){const i=Number(b),val=e.target.value;setAnswer(i,val);const q=DATA.questions[i],full=sentenceB(q,val),pos=B_ANSWER_POS[q.answer],target=val?'<span class="selected-target" style="font-weight:900;color:#1a6fa8;background:#e8f4ff;border-radius:6px;padding:2px 6px">'+esc(val)+'</span>':'<span class="phrase" style="'+POS_HINT_STYLES[pos]+'">'+esc(q.phrase)+'</span>',preview=$('b-preview-'+i),card=$('card-'+i);preview.innerHTML=esc(q.before)+target+esc(q.after);preview.dataset.say=full;$('b-original-'+i).hidden=!val;card.querySelector('.play').dataset.say=full;if(val)setTimeout(()=>speak(full),300)}const c=e.target.dataset.choice;if(c!==undefined){const i=Number(c);state.choices[i]=e.target.value;save();updateChoiceMenus();refreshProgress();}});
document.addEventListener('input',e=>{const key=e.target.dataset.text;if(key!==undefined){const i=Number(key);state.answers[i]=e.target.value;save();refreshProgress()}});
render();
</script></body></html>
