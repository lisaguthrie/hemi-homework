dialog.addEventListener('click',e=>{if(e.target===dialog){dialog.close();cancelSpeak()}});
dialog.addEventListener('close',cancelSpeak);
function exportPrint(){cancelSpeak();const header=`<h1>Wordly Wise 3000 · Book 6 · Lesson 6${MODE.toUpperCase()}</h1><div class="print-meta"><strong>${h(HEADERS[MODE][1])}</strong> &nbsp;·&nbsp; Name: Tina #14</div>`;let body='';if(MODE==='a'){body=QDATA.map(([word,sents],i)=>`<div class="print-q"><h2>${i+1}. ${h(word)}</h2>${sents.map((s,j)=>{const k=i*4+j,answer=state.answers[k];return `<div class="print-option">(${String.fromCharCode(97+j)}) ${highlightPrintVocab(s)} &nbsp; ${answer?`<strong><u>${h(answer)}</u></strong>`:'____'}</div>`}).join('')}</div>`).join('');}else if(MODE==='b'||MODE==='c'){body=QDATA.map(([prompt,opts],i)=>`<div class="print-q"><strong>${i+1}. ${highlightPrintVocab(prompt)}</strong>${opts.map((o,j)=>{const l='abcd'[j],isSelected=(state.answers[i]||[]).includes(l),txt=`(${l}) ${h(o)}`;return `<div class="print-option">${isSelected?`<strong><u>${txt}</u></strong>`:txt}</div>`}).join('')}</div>`).join('');}else if(MODE==='d'){body=QDATA.map((stem,i)=>`<div class="print-q"><strong>${i+1}. ${highlightPrintVocab(stem)}</strong><div class="printed-answer">${h(state.answers[i]||'')}</div></div>`).join('');}else{body=QDATA.map((question,i)=>`<div class="print-q"><strong>${i+1}. ${highlightPrintVocab(question)}</strong><div class="printed-answer">${h(state.answers[i]||'')}</div></div>`).join('');}document.getElementById('printSheet').innerHTML=header+body;window.print();}
function highlightPrintVocab(text){const s=String(text);vocabRegExp.lastIndex=0;let last=0,out='',m;while((m=vocabRegExp.exec(s))!==null){out+=h(s.slice(last,m.index))+'<strong>'+h(m[0])+'</strong>';last=m.index+m[0].length;}return out+h(s.slice(last));}
let lastClear=0;
function clearTwice(){const now=Date.now(),btn=document.getElementById('clearBtn');if(now-lastClear<4500){stopMic();state=startState();save();render();setLive('All responses were cleared.');lastClear=0;}else{lastClear=now;btn.textContent='Tap again to erase all responses';setLive('Tap the Clear button again to erase all responses.')}}
document.addEventListener('click',e=>{const def=e.target.closest('[data-def]');if(def){e.stopPropagation();openDefinition(def.dataset.def);return;}const binary=e.target.closest('[data-binary]');if(binary){const [i,value]=binary.dataset.binary.split(':');setBinary(Number(i),value);return;}const toggle=e.target.closest('[data-toggle]');if(toggle){const [i,value]=toggle.dataset.toggle.split(':');toggleAnswer(Number(i),value);return;}const readAnswer=e.target.closest('[data-read-answer]');if(readAnswer){const i=Number(readAnswer.dataset.readAnswer);const text=String(state.answers[i]||'').trim();speak(text?(MODE==='d'?QDATA[i]+' '+text:text):'No answer has been entered yet.');return;}const mic=e.target.closest('[data-mic]');if(mic){toggleMic(Number(mic.dataset.mic),mic);return;}const action=e.target.closest('[data-action]');if(action){switch(action.dataset.action){case 'check':checkAllRequest();break;case 'checkanyway':doCheck();break;case 'keepworking':document.getElementById('missingWarning').classList.add('hidden');break;case 'clear':clearTwice();break;case 'export':exportPrint();break;case 'closemodal':dialog.close();break;}return;}const read=e.target.closest('[data-speak]');if(read){speak(read.dataset.speak);return;}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-speak]')){e.preventDefault();speak(e.target.dataset.speak);}});
document.addEventListener('input',e=>{if(e.target.matches('[data-text-index]'))answerChangedText(Number(e.target.dataset.textIndex),e.target.value);});
document.addEventListener('change',e=>{if(e.target.matches('[data-word-choice]')){const i=Number(e.target.dataset.wordChoice);state.choices[i]=e.target.value;save();updateChoiceMenus();updateProgress();}});
speakingToast.addEventListener('click',cancelSpeak);
render();
</script></body></html>
