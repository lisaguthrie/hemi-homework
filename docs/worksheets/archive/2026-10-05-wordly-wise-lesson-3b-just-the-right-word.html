<script>'use strict'; const wordEntries=[{"word": "abundant", "paragraphs": [{"label": "abundant · adjective", "text": "More than enough; plentiful. If good weather continues, farmers can expect an abundant harvest."}, {"label": "abundance · noun", "text": "A great amount. Natural gas supplies an abundance of power to the entire country."}]}, {"word": "arid", "paragraphs": [{"label": "arid · adjective", "text": "Having little or no rainfall; very dry. Much of North Africa is arid land."}]}, {"word": "distinct", "paragraphs": [{"label": "distinct · adjective · 1", "text": "Not the same; different or separate. Apples come in over two thousand distinct varieties."}, {"label": "distinct · adjective · 2", "text": "Unmistakable; definite. Chili peppers add a distinct flavor to this dish."}]}, {"word": "graze", "paragraphs": [{"label": "graze · verb · 1", "text": "To feed on growing grass. A small herd of cows grazed in the meadow."}, {"label": "graze · verb · 2", "text": "To touch lightly in passing. The snowball grazed my cheek but didn’t hurt me."}]}, {"word": "hectic", "paragraphs": [{"label": "hectic · adjective", "text": "Full of feverish activity, haste, or confusion. After a hectic week of sightseeing, the tourists were glad to go home and relax."}]}, {"word": "horde", "paragraphs": [{"label": "horde · noun", "text": "A large group or crowd, especially one on the move. Hordes of swimmers head for the pool in summer."}]}, {"word": "humid", "paragraphs": [{"label": "humid · adjective", "text": "Having a large amount of water or moisture in the air. Residents escape the hot, humid weather by going inside where it is cool and dry."}, {"label": "humidity · noun", "text": "The amount of moisture in the air. The humidity was so high that the slightest activity made us sweat."}]}, {"word": "incredible", "paragraphs": [{"label": "incredible · adjective", "text": "Hard or impossible to believe. It seems incredible that no one was injured in such a bad accident."}]}, {"word": "inhabit", "paragraphs": [{"label": "inhabit · verb", "text": "To live in or on. Millions of bison once inhabited the great plains of America."}, {"label": "inhabitant · noun", "text": "A person or animal that lives in a certain place. Most of the inhabitants of California were born somewhere else."}]}, {"word": "peninsula", "paragraphs": [{"label": "peninsula · noun", "text": "A piece of land, connected to a larger land mass, that juts out and is almost completely surrounded by water. Bays along the Baja peninsula provide shelter for several kinds of whales."}]}, {"word": "rural", "paragraphs": [{"label": "rural · adjective", "text": "Of or relating to the country and the people who live there. The villagers believe that a shopping mall has no place in a rural area."}]}, {"word": "sanctuary", "paragraphs": [{"label": "sanctuary · noun · 1", "text": "A place of safety or shelter. The temple was a sanctuary to those who were being persecuted."}, {"label": "sanctuary · noun · 2", "text": "Protection offered by such a place. The shelter offers sanctuary to women fleeing violence in the home."}]}, {"word": "splendor", "paragraphs": [{"label": "splendor · noun", "text": "Magnificence; brilliance of appearance. The splendor of the palace at Versailles took our breath away."}, {"label": "splendid · adjective", "text": "Very impressive; magnificent. The exhibition of American sculpture includes several splendid statues by Harriet Hosmer."}]}, {"word": "squalor", "paragraphs": [{"label": "squalor · noun", "text": "Filth; misery. People lived in squalor after their homes were destroyed by the hurricane."}, {"label": "squalid · adjective", "text": "Dirty and unfit for living, especially as a result of neglect. The newly arrived immigrants worked long hours in squalid conditions for very low wages."}]}, {"word": "terrain", "paragraphs": [{"label": "terrain · noun · 1", "text": "An area of land; a region. After hiking for several days we knew the terrain quite well."}, {"label": "terrain · noun · 2", "text": "The surface features of a region. The mountainous terrain of western Colorado attracts skiers from all parts of the country."}]}]; 
function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.88; u.pitch=1.05;
  u.onstart=()=>document.getElementById('speakingToast').classList.add('visible');
  const hide=()=>document.getElementById('speakingToast').classList.remove('visible');
  u.onend=hide; u.onerror=hide;
  window.speechSynthesis.speak(u);
}
function cancelSpeak(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); document.getElementById('speakingToast').classList.remove('visible');}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const POS_META={
  noun:{short:'n',className:'pos-noun'},
  verb:{short:'v',className:'pos-verb'},
  adjective:{short:'adj',className:'pos-adjective'},
  adverb:{short:'adv',className:'pos-adverb'}
};
function parseDefinitionLabel(label){
  const parts=String(label).split('·').map(part=>part.trim()).filter(Boolean);
  const headword=parts[0]||'';
  const partOfSpeech=(parts[1]||'').toLowerCase();
  const sense=parts.slice(2).join(' · ');
  return {headword,partOfSpeech,sense};
}
function makePosTag(partOfSpeech){
  const meta=POS_META[partOfSpeech]||{short:partOfSpeech||'?',className:'pos-other'};
  const tag=document.createElement('span');
  tag.className='pos-tag '+meta.className;
  tag.textContent=meta.short;
  tag.title=partOfSpeech||'part of speech';
  tag.setAttribute('aria-label',partOfSpeech||'part of speech');
  return tag;
}
function entryPartsOfSpeech(entry){
  const seen=new Set(), out=[];
  (entry.paragraphs||[]).forEach(p=>{
    const info=parseDefinitionLabel(p.label);
    if(info.partOfSpeech && !seen.has(info.partOfSpeech)){
      seen.add(info.partOfSpeech);
      out.push(info.partOfSpeech);
    }
  });
  return out;
}
function splitDefinitionAndExample(text){
  const match=String(text).match(/^(.+?\.)(?:\s+)(.+)$/);
  if(!match)return {definition:text,example:''};
  return {definition:match[1],example:match[2]};
}
function buildDefinitionSpeech(label,definition,example){
  const spokenLabel=label.split('·').map(part=>part.trim()).filter(Boolean).join('. ')+'.';
  return spokenLabel+' Definition: '+definition+(example?' Example: '+example:'');
}
function openDefinition(word){
  const e=wordEntries.find(x=>x.word===word);
  if(!e)return;
  cancelSpeak();
  document.getElementById('definitionTitle').textContent=e.word;
  const body=document.getElementById('definitionBody'); body.innerHTML='';
  e.paragraphs.forEach(p=>{
    const parts=splitDefinitionAndExample(p.text);
    const card=document.createElement('div'); card.className='definition-card';
    const play=document.createElement('button'); play.className='definition-read-btn'; play.textContent='▶';
    play.setAttribute('aria-label','Read definition and example aloud');
    play.onclick=()=>speak(buildDefinitionSpeech(p.label,parts.definition,parts.example));
    const content=document.createElement('div'); content.className='definition-card-content';
    const info=parseDefinitionLabel(p.label);
    const label=document.createElement('div'); label.className='definition-label';
    const headword=document.createElement('span'); headword.className='definition-headword'; headword.textContent=info.headword;
    label.appendChild(headword);
    if(info.partOfSpeech) label.appendChild(makePosTag(info.partOfSpeech));
    if(info.sense){
      const sense=document.createElement('span'); sense.className='definition-sense'; sense.textContent='sense '+info.sense;
      label.appendChild(sense);
    }
    const defPart=document.createElement('div'); defPart.className='definition-part';
    const defKind=document.createElement('div'); defKind.className='definition-kind'; defKind.textContent='Definition';
    const defCopy=document.createElement('div'); defCopy.className='definition-copy'; defCopy.textContent=parts.definition;
    defPart.append(defKind,defCopy);
    content.append(label,defPart);
    if(parts.example){
      const exPart=document.createElement('div'); exPart.className='definition-part definition-example';
      const exKind=document.createElement('div'); exKind.className='definition-kind'; exKind.textContent='Example';
      const exCopy=document.createElement('div'); exCopy.className='definition-copy'; exCopy.textContent=parts.example;
      exPart.append(exKind,exCopy); content.append(exPart);
    }
    card.append(play,content); body.appendChild(card);
  });
  document.getElementById('readWord').onclick=()=>speak(e.word);
  document.getElementById('definitionDialog').showModal();
}
function renderWordBank(containerId){
  const b=document.getElementById(containerId); if(!b)return;
  wordEntries.forEach(e=>{
    const bt=document.createElement('button'); bt.className='bank-word'; bt.onclick=()=>openDefinition(e.word);
    const word=document.createElement('span'); word.className='bank-word-text'; word.textContent=e.word;
    const posList=document.createElement('span'); posList.className='bank-pos-list';
    entryPartsOfSpeech(e).forEach(pos=>posList.appendChild(makePosTag(pos)));
    bt.append(word,posList); b.appendChild(bt);
  });
}
function closeDefinition(){document.getElementById('definitionDialog').close(); cancelSpeak();}
document.addEventListener('click',e=>{
  const d=document.getElementById('definitionDialog');
  if(d && d.open && e.target===d) closeDefinition();
});
function doubleTapClear(btn,clearFn){
  if(btn.dataset.confirming==='true'){
    clearFn(); btn.dataset.confirming='false'; btn.textContent='🗑️ Clear all responses'; btn.removeAttribute('style'); return;
  }
  btn.dataset.confirming='true'; btn.textContent='⚠️ Tap again to confirm';
  btn.style.background='#ffeedd'; btn.style.color='#c05000'; btn.style.borderColor='#c05000';
  setTimeout(()=>{if(btn.dataset.confirming==='true'){btn.dataset.confirming='false';btn.textContent='🗑️ Clear all responses';btn.removeAttribute('style');}},3000);
}
function downloadPrintHtml(htmlText){
  const blob=new Blob([htmlText],{type:'text/html'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function printShell(title,body){
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>body{font-family:Arial,sans-serif;color:#111;margin:28px;line-height:1.45}.name-line{display:flex;gap:22px;margin:12px 0 22px}.name-line span{display:flex;align-items:flex-end;gap:6px}.line{display:inline-block;width:180px;border-bottom:1.5px solid #333}.item{margin:0 0 14px;break-inside:avoid}.selected{font-weight:700}.footer{margin-top:28px;font-size:12px;color:#555}button{padding:9px 14px}@media print{button{display:none}}</style></head><body>
  <button onclick="window.print()">Print</button><h1>${esc(title)}</h1><div class="name-line"><span>Name: <span class="line">Tina #18</span></span><span>Date: <span class="line"></span></span></div>${body}
  <div class="footer">Source: Wordly Wise 3000 · Book 6 · Lesson 3</div></body></html>`;
}
 
const STORAGE_KEY='worksheet_wordly_wise_lesson_3b_2026_10_05_v1';
const questions=[{"before":"The Underground Railroad offered ","phrase":"a place of shelter","after":" to slaves who were escaping to freedom.","answer":"sanctuary","answerText":"sanctuary"},{"before":"The first ball from the pitcher ","phrase":"just barely hit","after":" the batter’s shoulder.","answer":"grazed","answerText":"grazed"},{"before":"","phrase":"Large numbers","after":" of fans surrounded the stage door waiting for autographs.","answer":"hordes","answerText":"Hordes"},{"before":"Pitcairn Island has fewer than fifty ","phrase":"people who make their homes there","after":".","answer":"inhabitants","answerText":"inhabitants"},{"before":"Her life was ","phrase":"full of feverish activity","after":" because she worked at two full-time jobs.","answer":"hectic","answerText":"hectic"},{"before":"Mark Twain wrote about ","phrase":"life away from the cities and towns of","after":" America.","answer":"rural","answerText":"rural"},{"before":"The sounds of a flute and a trombone are quite ","phrase":"different from each other","after":" so you can easily tell them apart.","answer":"distinct","answerText":"distinct"},{"before":"Few crops can be grown where the land is ","phrase":"very dry and gets little rain","after":".","answer":"arid","answerText":"arid"},{"before":"Monet’s later paintings capture the ","phrase":"magnificent appearance","after":" of his garden at Giverny.","answer":"splendor","answerText":"splendor"},{"before":"Italy is ","phrase":"a large country that is almost completely surrounded by water","after":".","answer":"peninsula","answerText":"a peninsula"},{"before":"The ","phrase":"rough surface features of the land","after":" made travel difficult.","answer":"terrain","answerText":"terrain"},{"before":"Crops grow in ","phrase":"quantities that provide more than is needed","after":" in such fertile soil.","answer":"abundance","answerText":"abundance"}];
const answerChoices=[{"value":"abundance","label":"abundance","pos":"noun"},{"value":"arid","label":"arid","pos":"adjective"},{"value":"distinct","label":"distinct","pos":"adjective"},{"value":"grazed","label":"grazed","pos":"verb"},{"value":"hectic","label":"hectic","pos":"adjective"},{"value":"hordes","label":"hordes","pos":"noun"},{"value":"humid","label":"humid","pos":"adjective"},{"value":"incredible","label":"incredible","pos":"adjective"},{"value":"inhabitants","label":"inhabitants","pos":"noun"},{"value":"peninsula","label":"peninsula","pos":"noun"},{"value":"rural","label":"rural","pos":"adjective"},{"value":"sanctuary","label":"sanctuary","pos":"noun"},{"value":"splendor","label":"splendor","pos":"noun"},{"value":"squalor","label":"squalor","pos":"noun"},{"value":"terrain","label":"terrain","pos":"noun"}];
let currentChoiceIndex=-1;
let state={items:questions.map(()=>({selected:'',hinted:false})),answeredCount:0,total:questions.length};
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved&&Array.isArray(saved.items)&&saved.items.length===questions.length){
      state=saved;
      state.items=state.items.map(item=>({
        selected:item.selected||'',
        hinted:Boolean(item.hinted)
      }));
    }
  }catch(e){}
}
function save(){state.answeredCount=state.items.filter(x=>x.selected).length;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}updateProgress();}
function buildSentence(i){
  const q=questions[i], sel=state.items[i].selected;
  if(!sel)return q.before+q.phrase+q.after;
  const txt=(sel===q.answer?q.answerText:answerChoices.find(x=>x.value===sel)?.label||sel);
  return q.before+txt+q.after;
}
function addWords(el,text){
  const tokens=text.split(/(\s+)/);
  tokens.forEach(tok=>{if(/^\s+$/.test(tok)){el.appendChild(document.createTextNode(tok));return;}
    const b=document.createElement('button');b.className='plain-word';b.textContent=tok;b.type='button';
    b.setAttribute('aria-label','Read '+tok);b.onclick=e=>{e.stopPropagation();speak(tok.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,''));};el.appendChild(b);
  });
}
function answerChoiceForQuestion(i){
  return answerChoices.find(choice=>choice.value===questions[i].answer);
}
function requiredPos(i){
  return answerChoiceForQuestion(i)?.pos||'';
}
function posDisplayName(pos){
  return ({noun:'noun',verb:'verb',adjective:'adjective',adverb:'adverb'})[pos]||pos;
}
function renderChoiceGrid(i){
  const grid=document.getElementById('choiceGrid'); grid.innerHTML='';
  const wanted=state.items[i].hinted?requiredPos(i):'';
  const choices=wanted?answerChoices.filter(choice=>choice.pos===wanted):answerChoices;
  choices.forEach(c=>{
    const b=document.createElement('button'); b.className='choice-word'; b.textContent=c.label;
    b.onclick=()=>chooseWord(c.value); grid.appendChild(b);
  });
}
function openChoice(i){
  currentChoiceIndex=i;
  const wanted=state.items[i].hinted?requiredPos(i):'';
  document.getElementById('choiceTitle').textContent=wanted?'Choose a '+posDisplayName(wanted):'Choose a Word List 3 word';
  renderChoiceGrid(i);
  document.getElementById('choiceDialog').showModal();
}
function showPosHint(i){
  state.items[i].hinted=true;
  save();
  renderCard(i);
}
function chooseWord(v){
  const i=currentChoiceIndex;if(i<0)return;
  state.items[i]={selected:v,hinted:Boolean(state.items[i].hinted)};save();renderCard(i);document.getElementById('choiceDialog').close();setTimeout(()=>speak(buildSentence(i)),300);
}
function renderCard(i){
  const q=questions[i],s=state.items[i],card=document.getElementById('card-'+i);
  const sentence=document.getElementById('sentence-'+i);sentence.innerHTML='';
  addWords(sentence,q.before);
  const slot=document.createElement('span');slot.className='phrase-slot';
  if(s.hinted){
    const pos=requiredPos(i);
    if(pos) slot.classList.add('hint-pos-'+pos);
  }
  const text=document.createElement('span');text.textContent=s.selected?(s.selected===q.answer?q.answerText:answerChoices.find(x=>x.value===s.selected)?.label||s.selected):q.phrase;
  text.setAttribute('role','button');text.tabIndex=0;text.onclick=e=>{e.stopPropagation();speak(text.textContent);};
  const arrow=document.createElement('button');arrow.textContent='▾';arrow.title='Choose a word';arrow.onclick=e=>{e.stopPropagation();openChoice(i);};
  slot.append(text,arrow);sentence.appendChild(slot);addWords(sentence,q.after);
  document.getElementById('original-'+i).textContent=s.selected?'Original bold phrase: '+q.phrase:'';
  const hb=document.getElementById('hint-'+i);
  if(hb){
    hb.classList.toggle('active',s.hinted);
    hb.setAttribute('aria-pressed',s.hinted?'true':'false');
    hb.title=s.hinted?'Part-of-speech hint is on':'Show part-of-speech hint';
  }
}
function build(){
  renderWordBank('wordBank');
  const grid=document.getElementById('choiceGrid');
  const wrap=document.getElementById('questions');
  questions.forEach((q,i)=>{const card=document.createElement('article');card.className='question-card';card.id='card-'+i;
    card.innerHTML=`<div class="card-head"><div class="qnum">${i+1}.</div><div class="card-main"><div class="sentence" id="sentence-${i}"></div><div class="original" id="original-${i}"></div></div><div class="card-tools"><button class="play-btn" onclick="speak(buildSentence(${i}))" title="Read sentence">▶</button><button class="hint-btn" id="hint-${i}" onclick="showPosHint(${i})" aria-pressed="false" aria-label="Show part-of-speech hint" title="Show part-of-speech hint">💡</button></div></div>`;
    wrap.appendChild(card);renderCard(i);});
  updateProgress();
}
function updateProgress(){const p=document.getElementById('pips');p.innerHTML='';state.items.forEach(s=>{const d=document.createElement('span');d.className='pip'+(s.selected?' answered':'');p.appendChild(d);});document.getElementById('progressCount').textContent=state.items.filter(x=>x.selected).length+' / '+questions.length+' answered';}
document.getElementById('clearBtn').onclick=function(){doubleTapClear(this,()=>{try{localStorage.removeItem(STORAGE_KEY)}catch(e){};location.reload();})};
function exportPrint(){let body='';questions.forEach((q,i)=>{body+=`<div class="item"><strong>${i+1}.</strong> ${esc(buildSentence(i))}</div>`;});downloadPrintHtml(printShell('Wordly Wise Lesson 3B — Just the Right Word',body));}
load();build();
</script></body></html>
