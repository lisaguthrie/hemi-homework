<script>'use strict'; const wordEntries=[{"word": "abundant", "paragraphs": [{"label": "abundant · adjective", "text": "More than enough; plentiful. If good weather continues, farmers can expect an abundant harvest."}, {"label": "abundance · noun", "text": "A great amount. Natural gas supplies an abundance of power to the entire country."}]}, {"word": "arid", "paragraphs": [{"label": "arid · adjective", "text": "Having little or no rainfall; very dry. Much of North Africa is arid land."}]}, {"word": "distinct", "paragraphs": [{"label": "distinct · adjective · 1", "text": "Not the same; different or separate. Apples come in over two thousand distinct varieties."}, {"label": "distinct · adjective · 2", "text": "Unmistakable; definite. Chili peppers add a distinct flavor to this dish."}]}, {"word": "graze", "paragraphs": [{"label": "graze · verb · 1", "text": "To feed on growing grass. A small herd of cows grazed in the meadow."}, {"label": "graze · verb · 2", "text": "To touch lightly in passing. The snowball grazed my cheek but didn’t hurt me."}]}, {"word": "hectic", "paragraphs": [{"label": "hectic · adjective", "text": "Full of feverish activity, haste, or confusion. After a hectic week of sightseeing, the tourists were glad to go home and relax."}]}, {"word": "horde", "paragraphs": [{"label": "horde · noun", "text": "A large group or crowd, especially one on the move. Hordes of swimmers head for the pool in summer."}]}, {"word": "humid", "paragraphs": [{"label": "humid · adjective", "text": "Having a large amount of water or moisture in the air. Residents escape the hot, humid weather by going inside where it is cool and dry."}, {"label": "humidity · noun", "text": "The amount of moisture in the air. The humidity was so high that the slightest activity made us sweat."}]}, {"word": "incredible", "paragraphs": [{"label": "incredible · adjective", "text": "Hard or impossible to believe. It seems incredible that no one was injured in such a bad accident."}]}, {"word": "inhabit", "paragraphs": [{"label": "inhabit · verb", "text": "To live in or on. Millions of bison once inhabited the great plains of America."}, {"label": "inhabitant · noun", "text": "A person or animal that lives in a certain place. Most of the inhabitants of California were born somewhere else."}]}, {"word": "peninsula", "paragraphs": [{"label": "peninsula · noun", "text": "A piece of land, connected to a larger land mass, that juts out and is almost completely surrounded by water. Bays along the Baja peninsula provide shelter for several kinds of whales."}]}, {"word": "rural", "paragraphs": [{"label": "rural · adjective", "text": "Of or relating to the country and the people who live there. The villagers believe that a shopping mall has no place in a rural area."}]}, {"word": "sanctuary", "paragraphs": [{"label": "sanctuary · noun · 1", "text": "A place of safety or shelter. The temple was a sanctuary to those who were being persecuted."}, {"label": "sanctuary · noun · 2", "text": "Protection offered by such a place. The shelter offers sanctuary to women fleeing violence in the home."}]}, {"word": "splendor", "paragraphs": [{"label": "splendor · noun", "text": "Magnificence; brilliance of appearance. The splendor of the palace at Versailles took our breath away."}, {"label": "splendid · adjective", "text": "Very impressive; magnificent. The exhibition of American sculpture includes several splendid statues by Harriet Hosmer."}]}, {"word": "squalor", "paragraphs": [{"label": "squalor · noun", "text": "Filth; misery. People lived in squalor after their homes were destroyed by the hurricane."}, {"label": "squalid · adjective", "text": "Dirty and unfit for living, especially as a result of neglect. The newly arrived immigrants worked long hours in squalid conditions for very low wages."}]}, {"word": "terrain", "paragraphs": [{"label": "terrain · noun · 1", "text": "An area of land; a region. After hiking for several days we knew the terrain quite well."}, {"label" function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.88; u.pitch=1.05;
  u.onstart=()=>document.getElementById('speakingToast').classList.add('visible');
  const hide=()=>document.getElementById('speakingToast').classList.remove('visible');
  u.onend=hide; u.onerror=hide;
  window.speechSynthesis.speak(u);
}
function cancelSpeak(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); document.getElementById('speakingToast').classList.remove('visible');}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  e.paragraphs.forEach(p=>{
    const box=document.createElement('div'); box.className='definition-box';
    const strong=document.createElement('strong'); strong.textContent=p.label;
    const txt=document.createElement('p'); txt.textContent=p.text;
    const b=document.createElement('button'); b.className='read-def'; b.textContent='▶ Read this paragraph';
    b.onclick=()=>speak(p.label+'. '+p.text);
    box.append(strong,txt,b); body.appendChild(box);
  });
  document.getElementById('readWord').onclick=()=>speak(e.word);
  document.getElementById('definitionDialog').showModal();
}

}

l; very dry.”"}, {"before": "Monet’s later paintings capture the ", "phrase": "magnificent appearance", "after": " of his garden at Giverny.", "answer": "splendor", "answerText": "splendor", "hint": "Splendor means “magnificence; brilliance of appearance.”"}, {"before": "Italy is ", "phrase": "a large country that is almost completely surrounded by water", "after": ".", "answer": "peninsula", "answerText": "a peninsula", "hint": "A peninsula is “a piece of land, connected to a larger land mass, that juts out and is almost completely surrounded by water.”"}, {"before": "The ", "phrase": "rough surface features of the land", "after": " made travel difficult.", "answer": "terrain", "answerText": "terrain", "hint": "Use the meaning of terrain that says “the surface features of a region.”"}, {"before": "Crops grow in ", "phrase": "quantities that provide more than is needed", "after": " in such fertile soil.", "answer": "abundance", "answerText": "abundance", "hint": "Abundance means “a great amount.”"}];
const answerChoices=[{"value": "abundance", "label": "abundance"}, {"value": "arid", "label": "arid"}, {"value": "distinct", "label": "distinct"}, {"value": "grazed", "label": "grazed"}, {"value": "hectic", "label": "hectic"}, {"value": "hordes", "label": "hordes"}, {"value": "humid", "label": "humid"}, {"value": "incredible", "label": "incredible"}, {"value": "inhabitants", "label": "inhabitants"}, {"value": "peninsula", "label": "peninsula"}, {"value": "rural", "label": "rural"}, {"value": "sanctuary", "label": "sanctuary"}, {"value": "splendor", "label": "splendor"}, {"value": "squalor", "label": "squalor"}, {"value": "terrain", "label": "terrain"}];

function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&Array.isArray(s.items)&&s.items.length===questions.length)state=s;}catch(e){}}
function save(){state.answeredCount=state.items.filter(x=>x.selected).length;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}updateProgress();}
function buildSentence(i){
  const q=questions[i], sel=state.items[i].selected;
  if(!sel)return q.before+q.phrase+q.after;
  const txt=(sel===q.answer?q.answerText:answerChoices.find(x=>x.value===sel)?.label||sel);
  return q.before+txt+q.after;
}
function addWords(el,text){
  const tokens=text.split(/(\s+)/);
  tokens.forEach(tok=>{if(/^\s+$/.test(tok)){el.appendChild(document.createTextNode(tok));return;}
    const b=document.createElement('button');b.className='plain-word';b.textContent=tok;b.type='button';

  });
}

function check(i){const s=state.items[i];if(!s.selected)return;s.checked=true;s.correct=s.selected===questions[i].answer;save();renderCard(i);}
function renderCard(i){
  const q=questions[i],s=state.items[i],card=document.getElementById('card-'+i);card.classList.toggle('correct',s.correct);
  const sentence=document.getElementById('sentence-'+i);sentence.innerHTML='';
  addWords(sentence,q.before);
  const slot=document.createElement('span');slot.className='phrase-slot';
  const text=document.createElement('span');text.textContent=s.selected?(s.selected===q.answer?q.answerText:answerChoices.find(x=>x.value===s.selected)?.label||s.selected):q.phrase;
  text.setAttribute('role','button');text.tabIndex=0;text.onclick=e=>{e.stopPropagation();speak(text.textContent);};
  const arrow=document.createElement('button');arrow.textContent='▾';arrow.title='Choose a word';arrow.onclick=e=>{e.stopPropagation();openChoice(i);};
  slot.append(text,arrow);sentence.appendChild(slot);addWords(sentence,q.after);
  document.getElementById('original-'+i).textContent=s.selected?'Original bold phrase: '+q.phrase:'';
  const cb=document.getElementById('check-'+i);cb.disabled=!s.selected;cb.classList.toggle('done',s.correct);
  const fb=document.getElementById('fb-'+i);fb.className='feedback';if(s.checked){fb.classList.add('show',s.correct?'correct':'hint');fb.textContent=s.correct?'✅ That replacement fits the sentence.':'💡 Hint: '+q.hint;}
}
function build(){
  renderWordBank('wordBank');
  const grid=document.getElementById('choiceGrid');answerChoices.forEach(c=>{const b=document.createElement('button');b.className='choice-word';b.textContent=c.label;b.onclick=()=>chooseWord(c.value);grid.appendChild(b);});
  const wrap=document.getElementById('questions');
  questions.forEach((q,i)=>{const card=document.createElement('article');card.className='question-card';card.id='card-'+i;
    card.innerHTML=`<div class="card-head"><div class="qnum">${i+1}.</div><div class="card-main"><div class="sentence" id="sentence-${i}"></div><div class="original" id="original-${i}"></div><button class="check-btn" id="check-${i}" onclick="check(${i})">📝 Check answer</button><div id="fb-${i}" class="feedback"></div></div><button class="play-btn" onclick="speak(buildSentence(${i}))" title="Read sentence">▶</button></div>`;
    wrap.appendChild(card);renderCard(i);});
  updateProgress();
}
function updateProgress(){const p=document.getElementById('pips');p.innerHTML='';state.items.forEach(s=>{const d=document.createElement('span');d.className='pip'+(s.correct?' done':s.selected?' answered':'');p.appendChild(d);});document.getElementById('progressCount').textContent=state.items.filter(x=>x.selected).length+' / '+questions.length+' answered';}
document.getElementById('clearBtn').onclick=function(){doubleTapClear(this,()=>{try{localStorage.removeItem(STORAGE_KEY)}catch(e){};location.reload();})};
function exportPrint(){let body='';questions.forEach((q,i)=>{body+=`<div class="item"><strong>${i+1}.</strong> ${esc(buildSentence(i))}</div>`;});downloadPrintHtml(printShell('Wordly Wise Lesson 3B — Just the Right Word',body));}
load();build();
</script></body></html>
