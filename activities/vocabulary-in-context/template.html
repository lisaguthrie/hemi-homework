   "But Hollywood movies do not give a very realistic picture of the life cowboys really led.",

   "The vaqueros contributed to the English language many of the words we associate with the Wild West, including sombrero, mustang, and rodeo."
  ],
  [
   "Following the end of the Civil War in 1865, the vaqueros’ numbers swelled with veterans who headed west to work on cattle ranches.",
   "Many were African Americans who found a greater degree of freedom in lands that were just opening up to settlement.",
   "The rodeo offered them an opportunity to prove their worth.",
   "One of the earliest performers was an African American cowboy named Nat Love.",
   "Love was born in Tennessee as an enslaved person in 1854.",
   "As a boy of fifteen, he worked as a trail hand out of Dodge City.",
   "There he learned the riding and roping skills that made him a star of the rodeo.",
   "Perhaps the most famous rodeo performer was Bill Pickett, star of the Miller Brothers’ Wild West Show.",

   "But the lives of the real cowboys were quite monotonous.",

   "They kept a string of mustangs, the hardy wild ponies that roamed the plains, and changed to fresh mounts several times a day.",

  "What is the meaning of soothe as it is used in the passage?",
  "What do you think would be a welcome sight to ravenous cowboys?",
  "How did the end of the Civil War affect the Wild West?",
  "What is the meaning of constant as it is used in the passage?"
 ]
}
</script><script>
'use strict';
const CFG=JSON.parse(document.getElementById('activityConfig').textContent);
const META=CFG.meta,QUESTIONS=CFG.questions,PASSAGE=CFG.passage,WORDS=CFG.words;
const FORMS=CFG.formPairs||Object.fromEntries(WORDS.map(w=>[w.word,[w.word]]));
const KEY=META.storageKey,TOTAL=QUESTIONS.length;
const POS_NAMES={n:'noun',v:'verb',adj:'adjective',adv:'adverb'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=s=>esc(s).replace(/\n/g,'&#10;');
document.title=META.printTitle+' · '+META.title;
/* ---------- state ---------- */
const initState=()=>({answers:QUESTIONS.map(()=>''),choices:QUESTIONS.map(()=>'')});
function load(){try{const old=JSON.parse(localStorage.getItem(KEY));const x=initState();if(old&&Array.isArray(old.answers)&&old.answers.length===TOTAL){x.answers=old.answers.map(v=>String(v||''));if(Array.isArray(old.choices)&&old.choices.length===TOTAL)x.choices=old.choices.map(v=>String(v||''))}return x}catch(e){return initState()}}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){setLive('Answers cannot be saved in this browser. Export or print before closing.')}}
function setLive(msg){$('liveStatus').textContent=msg}
/* ---------- vocabulary matching ---------- */
const wordMap={};Object.keys(FORMS).forEach(k=>FORMS[k].forEach(f=>wordMap[f.toLowerCase()]=k));
const reVocab=new RegExp('\\b(?:'+Object.keys(wordMap).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
function hasLessonWord(text){return (String(text).match(/\b[a-z]+\b/gi)||[]).some(w=>wordMap[w.toLowerCase()])}
function vocabify(text){const src=String(text),rex=new RegExp(reVocab.source,'gi');let out='',last=0,m;while((m=rex.exec(src))){out+=esc(src.slice(last,m.index));out+='<button type="button" class="inline-vocab" data-def="'+attr(wordMap[m[0].toLowerCase()])+'" aria-label="Definition of '+attr(m[0])+'">'+esc(m[0])+'</button>';last=m.index+m[0].length}return out+esc(src.slice(last))}
function complete(i){return Boolean(String(state.answers[i]||'').trim())&&(hasLessonWord(QUESTIONS[i])||Boolean(state.choices[i]))}
/* ---------- speech out ---------- */
const toast=$('speakingToast');let spoken=null;
function cancelSpeak(){if('speechSynthesis' in window)window.speechSynthesis.cancel();spoken=null;toast.hidden=true}
function speak(raw){const text=String(raw??'').replace(/\s+/g,' ').trim();if(!text)return;stopMic();cancelSpeak();if(!('speechSynthesis' in window)){setLive('Read-aloud is not available in this browser.');return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.pitch=1.05;spoken=u;u.onend=u.onerror=()=>{if(spoken===u){spoken=null;toast.hidden=true}};toast.hidden=false;window.speechSynthesis.speak(u)}
/* ---------- rendering ---------- */
const posBadge=p=>'<span class="pos pos-'+attr(p)+'">'+esc(p)+'</span>';
function wordBank(){return '<div class="word-grid">'+WORDS.map(w=>'<button type="button" class="word-btn" data-def="'+attr(w.word)+'">'+esc(w.word)+' '+[...new Set(w.senses.map(s=>s.pos))].map(posBadge).join('')+'</button>').join('')+'</div>'}
function micButton(i){if(!MicCtor)return '<button type="button" class="mic" disabled aria-label="Dictation unavailable in this browser">🎙️ Unavailable</button>';return '<button type="button" class="mic" data-mic="'+i+'" aria-label="Start dictation for question '+(i+1)+'">🎙️ Dictate</button>'}
function questionCard(q,i){const extra=!hasLessonWord(q);return '<section class="question" id="card-'+i+'"><div class="card-top"><span class="qnum">'+(i+1)+'</span><div class="qbody"><div class="q-title tap" role="button" tabindex="0" data-say="'+attr(q)+'">'+vocabify(q)+'</div>'+(extra?'<div class="extra-word"><label for="choice-'+i+'">Use one lesson word in your answer:</label><select id="choice-'+i+'" data-choice="'+i+'" aria-label="Choose a lesson vocabulary word for question '+(i+1)+'"><option value="">Choose a word…</option></select></div>':'')+'<label class="sr-only" for="answer-'+i+'">Answer for question '+(i+1)+'</label><textarea id="answer-'+i+'" data-text="'+i+'" placeholder="Write or dictate a complete sentence…" spellcheck="true" autocomplete="off">'+esc(state.answers[i])+'</textarea><div class="write-actions"><button type="button" class="secondary" data-read-answer="'+i+'">▶ Read my answer</button>'+micButton(i)+'</div></div><div class="tools"><button class="play" type="button" data-say="'+attr(q)+'" aria-label="Read question '+(i+1)+'">▶</button></div></div></section>'}
function normalizePassage(paragraphs){return paragraphs.map(entry=>{const values=Array.isArray(entry)?entry:[entry];return values.flatMap(value=>{const text=String(value??'').trim();if(!text)return[];return text.split(/(?<=[.!?])\s+(?=[A-Z"'])/).map(s=>s.trim()).filter(Boolean)})})}
function render(){
  const passage=normalizePassage(PASSAGE);
  const paragraphs=passage.map((sentences,i)=>'<section class="passage-card"><button class="play" type="button" data-say="'+attr(sentences.join(' '))+'" aria-label="Read paragraph '+(i+1)+'">▶</button><div class="passage-text">'+sentences.map(s=>'<span class="sentence" tabindex="0" role="button" data-say="'+attr(s)+'" aria-label="Read sentence">'+vocabify(s)+'</span>').join(' ')+'</div></section>').join('');
  $('app').innerHTML='<header><div><p class="eyebrow">'+esc(META.bookLabel)+'</p><h1>Lesson '+esc(META.lessonLabel)+' · '+esc(META.title)+'</h1></div><a class="back" href="'+attr(META.backHref)+'">'+esc(META.backLabel)+'</a></header>'
  +'<main class="reading-workspace"><section class="pane" aria-label="Reading passage"><div class="pane-head"><h2>📖 '+esc(META.passageTitle)+'</h2><span class="brief-help">Tap a sentence or ▶ paragraph</span></div><div class="pane-content">'+paragraphs+'</div></section>'
  +'<section class="pane" aria-label="Questions"><div class="pane-head"><h2>✍️ Questions</h2><span id="headerProgress" class="brief-help"></span></div><div class="pane-content"><button class="instructions" type="button" data-say="'+attr(META.instructions)+'">🔊 '+esc(META.instructions)+'</button><details class="reading-bank"><summary>📖 Show / hide '+esc(META.wordListLabel)+'</summary>'+wordBank()+'</details>'+QUESTIONS.map(questionCard).join('')
  +'<div class="progress-box"><div class="progress-label" id="progressText"></div><div class="pips" id="progressPips" aria-label="Question progress"></div><p class="adult-note">Open-ended sentences are reviewed by an adult. Answers are saved as you type or dictate.</p><div class="footer-buttons"><button class="clear" type="button" id="clearBtn" data-action="clear">🗑️ Clear all responses</button><button class="print" type="button" data-action="print">🖨️ Export / Print</button></div></div></div></section></main>';
  updateChoiceMenus();refreshProgress();
}
function refreshProgress(){const n=QUESTIONS.filter((_,i)=>complete(i)).length;$('progressText').textContent=n+' of '+TOTAL+' answered · adult review';$('headerProgress').textContent=n+' / '+TOTAL+' answered';$('progressPips').innerHTML=QUESTIONS.map((_,i)=>'<span class="pip '+(complete(i)?'answered':'')+'" title="Question '+(i+1)+': '+(complete(i)?'answered':'unanswered')+'"></span>').join('')}
function updateChoiceMenus(){const claimed=new Set(state.choices.filter(x=>x&&x!=='__different__'));QUESTIONS.forEach((q,i)=>{const el=$('choice-'+i);if(!el)return;const old=state.choices[i]||'';const words=WORDS.map(x=>x.word).filter(x=>x===old||!claimed.has(x));el.innerHTML='<option value="">Choose a word…</option>'+words.map(w=>'<option value="'+attr(w)+'">'+esc(w)+'</option>').join('')+'<option value="__different__">Choose a different word…</option>';el.value=old})}
/* ---------- definitions ---------- */
const dlg=$('definitionDlg');
function openDefinition(word){const w=WORDS.find(x=>x.word===word);if(!w)return;cancelSpeak();const cards=w.senses.map(s=>{const say=s.form+'. '+(POS_NAMES[s.pos]||s.pos)+'. '+(s.num?'Meaning '+s.num+'. ':'')+'Definition: '+s.definition+' Example: '+s.example;return '<div class="definition-card"><button type="button" class="play" data-say="'+attr(say)+'" aria-label="Read definition and example">▶</button><div><div class="definition-word">'+esc(s.form)+' '+posBadge(s.pos)+(s.num?' · Sense '+esc(s.num):'')+'</div><div class="definition-row" role="button" tabindex="0" data-say="'+attr(s.definition)+'" aria-label="Read definition aloud"><span class="definition-label">Definition</span><span>'+esc(s.definition)+'</span></div><div class="definition-row example" role="button" tabindex="0" data-say="'+attr(s.example)+'" aria-label="Read example aloud"><span class="definition-label">Example</span><span class="definition-copy">'+esc(s.example)+'</span></div></div></div>'}).join('');dlg.innerHTML='<div class="dialog-heading"><h2>'+esc(w.word)+'</h2><button type="button" class="close" data-action="closeDef">✕ Close</button></div>'+cards;dlg.showModal()}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',cancelSpeak);
/* ---------- dictation ---------- */
const MicCtor=window.SpeechRecognition||window.webkitSpeechRecognition;
let recorder=null,recordingButton=null,listening=false,micTarget=null;
function micIdle(btn){if(btn){btn.classList.remove('listening');btn.textContent='🎙️ Dictate';btn.setAttribute('aria-label','Start dictation for question '+(Number(btn.dataset.mic)+1))}}
function stopMic(){listening=false;if(recorder){const r=recorder;recorder=null;try{r.stop()}catch(e){}}micIdle(recordingButton);recordingButton=null;micTarget=null}
function appendDictation(area,text){const t=String(text||'').trim();if(!t)return;const cur=area.value.replace(/\s+$/,'');area.value=cur?cur+' '+t:t;area.dispatchEvent(new Event('input',{bubbles:true}))}
function startRecognition(){const r=new MicCtor();recorder=r;r.lang='en-US';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{let add='';for(let j=e.resultIndex;j<e.results.length;j++)if(e.results[j].isFinal)add+=e.results[j][0].transcript+' ';if(micTarget)appendDictation(micTarget,add)};
  r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;const denied=e.error==='not-allowed'||e.error==='service-not-allowed';setLive(denied?'The microphone is blocked. Allow microphone access in the browser, or type your answer.':'Dictation stopped. You can still type your answer.');stopMic()};
  r.onend=()=>{if(recorder!==r)return;if(listening){try{startRecognition();return}catch(err){}}stopMic()};
  r.start()}
function toggleMic(i,btn){if(recordingButton===btn){stopMic();setLive('Dictation stopped.');return}stopMic();if(!MicCtor){setLive('Dictation is not available in this browser. You can still type your answer.');return}cancelSpeak();try{listening=true;recordingButton=btn;micTarget=$('answer-'+i);btn.classList.add('listening');btn.textContent='■ Stop recording';btn.setAttribute('aria-label','Stop dictation for question '+(i+1));setLive('Listening. Say your sentence.');startRecognition()}catch(e){setLive('Dictation could not start. You can still type your answer.');stopMic()}}
/* ---------- clear / print ---------- */
let clearArmed=false,clearTimer=null;
function clearTwice(){if(!clearArmed){clearArmed=true;const b=$('clearBtn');b.textContent='Tap again to clear every answer';b.style.borderColor='#d94f58';setLive('Tap Clear again to remove all answers.');clearTimer=setTimeout(()=>{clearArmed=false;const c=$('clearBtn');if(c){c.textContent='🗑️ Clear all responses';c.style.borderColor=''}},4000);return}clearTimeout(clearTimer);clearArmed=false;stopMic();cancelSpeak();state=initState();try{localStorage.removeItem(KEY)}catch(e){}render();setLive('All answers cleared.')}
function exportPrint(){cancelSpeak();stopMic();const passage=normalizePassage(PASSAGE);const body='<h2>'+esc(META.passageTitle)+'</h2>'+passage.map(p=>'<p>'+esc(p.join(' '))+'</p>').join('')+'<h2>Questions</h2>'+QUESTIONS.map((q,i)=>'<div class="print-q"><strong>'+(i+1)+'. '+esc(q)+'</strong><div class="printed-answer">'+esc(state.answers[i])+'</div>'+(state.choices[i]?'<small>Vocabulary choice: '+esc(state.choices[i]==='__different__'?'Chosen in written response':state.choices[i])+'</small>':'')+'</div>').join('');$('printSheet').innerHTML='<h1>'+esc(META.printTitle)+'</h1><div class="print-meta"><strong>'+esc(META.title)+'</strong> · Name: '+esc(META.studentName)+'</div><p>'+esc(META.instructions)+'</p>'+body;window.print()}
/* ---------- events ---------- */
toast.addEventListener('click',cancelSpeak);
document.addEventListener('click',e=>{
  const def=e.target.closest('[data-def]');if(def){openDefinition(def.dataset.def);return}
  const ra=e.target.closest('[data-read-answer]');if(ra){const t=String(state.answers[Number(ra.dataset.readAnswer)]||'').trim();speak(t||'No answer entered yet.');return}
  const mic=e.target.closest('[data-mic]');if(mic){toggleMic(Number(mic.dataset.mic),mic);return}
  const act=e.target.closest('[data-action]');if(act){const a=act.dataset.action;if(a==='closeDef')dlg.close();else if(a==='clear')clearTwice();else if(a==='print')exportPrint();return}
  const say=e.target.closest('[data-say]');if(say){speak(say.dataset.say)}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target;if(el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.say&&!el.matches('button')){e.preventDefault();speak(el.dataset.say)}});
document.addEventListener('input',e=>{const k=e.target.dataset.text;if(k!==undefined){state.answers[Number(k)]=e.target.value;save();refreshProgress()}});
document.addEventListener('change',e=>{const c=e.target.dataset.choice;if(c!==undefined){state.choices[Number(c)]=e.target.value;save();updateChoiceMenus();refreshProgress()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMic()});
render();
</script></body></html>
