</script><script>
const CFG=JSON.parse(document.getElementById('activityConfig').textContent);
const WORDS=CFG.words,FORMS=CFG.formPairs;
const DATA={mode:'a',directions:CFG.meta.instructions,questions:CFG.questions.map(([choices,pair,hint])=>({choices,pair:pair.split(''),hint}))};
const KEY=CFG.meta.storageKey;
const POS_NAMES={n:'noun',v:'verb',adj:'adjective'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const emptyAnswer=()=>[];
const initState=()=>({answers:DATA.questions.map(()=>emptyAnswer()),choices:DATA.questions.map(()=>''),review:DATA.questions.map(()=>null),attempts:0,grants:0});
function load(){try{let old=JSON.parse(localStorage.getItem(KEY));if(!old||!Array.isArray(old.answers)||old.answers.length!==DATA.questions.length)return initState();const x=initState();for(const k of ['answers','choices','review','attempts','grants'])if(old[k]!==undefined)x[k]=old[k];if(!Array.isArray(x.review)||x.review.length!==DATA.questions.length)x.review=DATA.questions.map(()=>null);if(!Array.isArray(x.choices)||x.choices.length!==DATA.questions.length)x.choices=DATA.questions.map(()=>'');return x}catch(e){return initState()}}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function status(msg){$('liveStatus').textContent=msg;}
const wordMap={};Object.keys(FORMS).forEach(k=>FORMS[k].forEach(f=>wordMap[f.toLowerCase()]=k));
const reVocab=new RegExp('\\b(?:'+Object.keys(wordMap).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
function vocabify(text){let result='',last=0;const source=String(text);const rex=new RegExp(reVocab.source,'gi');let m;while((m=rex.exec(source))){result+=esc(source.slice(last,m.index));const family=wordMap[m[0].toLowerCase()];result+='<button type="button" class="inline-vocab" data-vocab="'+attr(family)+'" aria-label="Definition of '+attr(m[0])+'">'+esc(m[0])+'</button>';last=m.index+m[0].length}return result+esc(source.slice(last))}
let spoken=null;
function cancelSpeak(){if('speechSynthesis'in window)window.speechSynthesis.cancel();spoken=null;$('speakingToast').hidden=true}
function speak(raw){const text=String(raw??'').trim();if(!text)return;cancelSpeak();if(!('speechSynthesis' in window)){status('Read-aloud is not available in this browser.');return;}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.pitch=1.05;spoken=u;u.onend=()=>{if(spoken===u){spoken=null;$('speakingToast').hidden=true}};u.onerror=u.onend;$('speakingToast').hidden=false;window.speechSynthesis.speak(u)}
function vocabSegments(text){const seg=s=>s.trim()?'<span class="say-seg" role="button" tabindex="0" data-say="'+attr(s.trim())+'">'+esc(s)+'</span>':esc(s);let result='',last=0;const source=String(text);const rex=new RegExp(reVocab.source,'gi');let m;while((m=rex.exec(source))){result+=seg(source.slice(last,m.index));const family=wordMap[m[0].toLowerCase()];result+='<button type="button" class="inline-vocab" data-vocab="'+attr(family)+'" aria-label="Definition of '+attr(m[0])+'">'+esc(m[0])+'</button>';last=m.index+m[0].length}return result+seg(source.slice(last))}
function posBadge(p){return '<span class="pos pos-'+attr(p)+'">'+esc(p)+'</span>'}
function renderWordBank(){return '<div class="word-grid">'+WORDS.map(w=>'<button type="button" class="word-btn" data-vocab="'+attr(w.word)+'">'+esc(w.word)+' '+[...new Set(w.senses.map(s=>s.pos))].map(posBadge).join('')+'</button>').join('')+'</div>'}
function openDefinition(word){const w=WORDS.find(x=>x.word===word);if(!w)return;cancelSpeak();const cards=w.senses.map(s=>{const spoken=s.form+'. '+POS_NAMES[s.pos]+'. '+(s.num?'Meaning '+s.num+'. ':'')+'Definition: '+s.definition+' Example: '+s.example;return '<div class="definition-card"><button type="button" class="play" data-say="'+attr(spoken)+'" aria-label="Read definition and example">▶</button><div><div class="definition-word">'+esc(s.form)+' '+posBadge(s.pos)+(s.num?' · Sense '+esc(s.num):'')+'</div><div class="definition-row"><span class="definition-label">Definition</span><span class="definition-copy">'+esc(s.definition)+'</span></div><div class="definition-row example"><span class="definition-label">Example</span><span class="definition-copy">'+esc(s.example)+'</span></div></div></div>'}).join('');$('definitionDlg').innerHTML='<div class="dialog-heading"><h2>'+esc(w.word)+'</h2><button type="button" class="close" data-action="closeDef">✕ Close</button></div>'+cards;$('definitionDlg').showModal()}
function qComplete(i){const a=state.answers[i];return Array.isArray(a)&&a.length===2;}
function isCorrect(i){const q=DATA.questions[i],a=state.answers[i];return [...a].sort().join(',')===[...q.pair].sort().join(',')}
function markChanged(i){state.review[i]=null;save();refreshProgress();refreshCheck();const s=$('status-'+i);if(s){s.className='status none';s.textContent=''}const c=$('card-'+i);if(c)c.classList.remove('good','review');}
function setAnswer(i,value){state.answers[i]=value;markChanged(i)}
function assembled(q,selected){if(!selected||selected.length!==2)return '';const starts=selected.filter(letter=>/^([A-Z]|To\b)/.test(q.choices['abcd'.indexOf(letter)]||''));const first=starts[0]||selected[0];const second=selected.find(x=>x!==first);let a=q.choices['abcd'.indexOf(first)]||'',b=q.choices['abcd'.indexOf(second)]||'';return a+' '+b}
function answerHint(q){return q.hint}
function cardStatus(i){const r=state.review[i];if(!r)return '';const hint=answerHint(DATA.questions[i]);return '<div id="status-'+i+'" class="status '+(r==='ok'?'ok':'needs')+'">'+(r==='ok'?'✅ Meaning matched.':'💡 Hint: '+esc(hint))+'</div>'}
function cardClass(i){return state.review[i]==='ok'?'good':state.review[i]==='review'?'review':''}
function ACard(q,i){const a=state.answers[i],text=assembled(q,a);return '<section class="question '+cardClass(i)+'" id="card-'+i+'"><div class="card-top"><span class="qnum">'+(i+1)+'</span><div class="qbody"><p class="brief-help">Choose two lettered phrases. Tap 🔊 to hear a phrase.</p><div class="options">'+q.choices.map((txt,j)=>{const key='abcd'[j],picked=a.includes(key);return '<div class="opt"><button type="button" class="pick" data-action="pickA" data-i="'+i+'" data-v="'+key+'" aria-pressed="'+picked+'" '+(a.length>=2&&!picked?'disabled':'')+' aria-label="Select phrase '+key+'">'+(picked?'✓ ':'')+key+'</button><span class="opt-read" data-say="'+attr(txt)+'"><span class="opt-text">'+vocabSegments(txt)+'</span></span><button type="button" class="play opt-say" data-say="'+attr(txt)+'" aria-label="Read phrase '+key+' aloud">🔊</button></div>'}).join('')+'</div><div class="answer-preview '+(text?'':'empty')+'">'+(text?'Sentence: '+esc(text):'Sentence: choose two phrases')+'</div>'+cardStatus(i)+'</div><div class="tools"><button class="play" type="button" data-say="'+attr(text||q.choices.join('. '))+'" aria-label="Read '+(text?'assembled sentence':'phrases')+'">▶</button></div></div></section>'}
function renderFooter(){const total=DATA.questions.length;return '<div class="progress-box"><div class="progress-label" id="progressText">0 of '+total+' answered</div><div class="pips" id="progressPips" aria-label="Question progress"></div><div class="check-panel" id="checkPanel"></div><div class="footer-buttons"><button class="clear" type="button" id="clearBtn" data-action="clear">🗑️ Clear all responses</button><button class="print" type="button" data-action="print">🖨️ Export / Print</button></div><div id="printNotice" role="status" class="adult-note"></div></div>'}
function render(){$('main').innerHTML='<button type="button" class="instructions" data-say="'+attr(DATA.directions)+'">🔊 '+esc(DATA.directions)+'</button><section class="bank"><p class="bank-title">'+esc(CFG.meta.wordListLabel)+' · tap any word for its definition</p>'+renderWordBank()+'</section>'+DATA.questions.map(ACard).join('')+renderFooter();refreshProgress();refreshCheck()}
function refreshProgress(){if(!$('progressPips'))return;const n=DATA.questions.filter((_,i)=>qComplete(i)).length,tot=DATA.questions.length;$('progressText').textContent=n+' of '+tot+' answered';$('progressPips').innerHTML=DATA.questions.map((q,i)=>{const r=state.review[i],st=r==='ok'?'ok':r==='review'?'review':qComplete(i)?'answered':'';return '<span class="pip '+st+'" title="Question '+(i+1)+': '+(r==='ok'?'checked':r==='review'?'needs review':qComplete(i)?'answered':'unanswered')+'"></span>'}).join('')}
function refreshCheck(){const panel=$('checkPanel');if(!panel)return;const all=DATA.questions.every((_,i)=>qComplete(i)),allCorrect=state.review.every(x=>x==='ok'),remaining=3+state.grants-state.attempts;panel.innerHTML=allCorrect?'<span class="check-complete">✅ All answers checked!</span>':('<button class="check-button" type="button" data-action="check" '+(remaining<=0?'disabled':'')+'>📝 Check all answers</button><span class="adult-note">'+remaining+' check'+(remaining===1?'':'s')+' left</span><div class="check-message" id="checkMessage"></div>'+(remaining<=0?'<div class="adult-panel"><button class="secondary" type="button" data-action="unlock">🔒 Adult: unlock another check</button><div id="adultEntry" hidden><label for="adultCode">Adult code</label><input type="password" autocomplete="off" id="adultCode" inputmode="numeric"><button class="secondary" data-action="grant" type="button">Unlock one check</button></div></div>':''))}
function checkAll(){const missing=DATA.questions.map((q,i)=>!qComplete(i)?i+1:null).filter(Boolean);if(missing.length){const m=$('checkMessage');if(m)m.textContent='Finish question'+(missing.length>1?'s':'')+' '+missing.join(', ')+' before checking.';return;}if(state.attempts>=3+state.grants){status('An adult can unlock another check.');return;}state.attempts++;DATA.questions.forEach((_,i)=>state.review[i]=isCorrect(i)?'ok':'review');save();render();const missed=state.review.filter(x=>x!=='ok').length;status(missed?'Checked. '+missed+' question'+(missed>1?'s':'')+' need another look.':'All meanings matched.');}
let clearArmed=false,clearTimer=null;
function clearTwice(){if(!clearArmed){clearArmed=true;const b=$('clearBtn');b.textContent='Tap again to clear every answer';b.style.borderColor='#d94f58';status('Tap Clear again to remove all answers.');if(clearTimer)clearTimeout(clearTimer);clearTimer=setTimeout(()=>{clearArmed=false;const current=$('clearBtn');if(current){current.textContent='🗑️ Clear all responses';current.style.borderColor=''}},4000);return;}if(clearTimer)clearTimeout(clearTimer);clearTimer=null;cancelSpeak();clearArmed=false;state=initState();try{localStorage.removeItem(KEY)}catch(e){}render();status('All answers cleared.');}
function printable(){const heading='<h1>'+esc(CFG.meta.printTitle)+'</h1><h2>'+esc(CFG.meta.title)+'</h2>'+(CFG.meta.studentName?'<p>Name: '+esc(CFG.meta.studentName)+'</p>':'')+'<p>'+esc(DATA.directions)+'</p>';const h=txt=>esc(txt);const body=DATA.questions.map((q,i)=>'<article><strong>'+(i+1)+'.</strong> '+q.choices.map((x,j)=>'('+('abcd'[j])+') '+h(x)).join(' &nbsp; / &nbsp; ')+'<div>Sentence: <b><u>'+h(assembled(q,state.answers[i])||'____________________________')+'</u></b></div></article>').join('');
const source=esc(CFG.meta.bookLabel)+' · Student responses only; no answer key included.';return '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>'+esc(CFG.meta.printTitle)+' · completed worksheet</title><style>body{font:15px/1.48 Arial,sans-serif;color:#111;max-width:850px;margin:25px auto;padding:0 20px}h1{font-size:22px}h2{font-size:17px}article{break-inside:avoid;border-bottom:1px solid #ddd;padding:9px 0}.print-options{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:7px 0}.answer{min-height:30px;padding:5px 0}.clue{font-size:13px;color:#333}.foot{margin-top:30px;color:#666;font-size:12px}button{padding:8px 15px;border:1px solid #888;border-radius:5px}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Print</button>'+heading+body+'<p class="foot">'+source+'</p></body></html>'}
function exportPrint(){cancelSpeak();const blob=new Blob([printable()],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob);const tab=window.open(url,'_blank');if(!tab){const link=document.createElement('a');link.href=url;link.download='wordly-wise-lesson-'+CFG.meta.lessonLabel.toLowerCase()+'-finding-meanings-completed.html';document.body.appendChild(link);link.click();link.remove();const notice=$('printNotice');if(notice)notice.textContent='A printable HTML copy was saved. Open it and print.'}else{const notice=$('printNotice');if(notice)notice.textContent='Printable worksheet opened in a new tab. Use Print there.'}setTimeout(()=>URL.revokeObjectURL(url),60000)}
$('speakingToast').addEventListener('click',cancelSpeak);
$('definitionDlg').addEventListener('click',e=>{if(e.target===$('definitionDlg'))$('definitionDlg').close()});
$('definitionDlg').addEventListener('close',cancelSpeak);
document.addEventListener('click',e=>{const vocab=e.target.closest('[data-vocab]');if(vocab){openDefinition(vocab.dataset.vocab);return}const btn=e.target.closest('[data-action]');if(btn){const act=btn.dataset.action,i=Number(btn.dataset.i),v=btn.dataset.v;if(act==='closeDef'){$('definitionDlg').close();return}if(act==='pickA'){const a=state.answers[i].slice();const index=a.indexOf(v);if(index>=0)a.splice(index,1);else if(a.length<2)a.push(v);setAnswer(i,a);render();if(a.length===2)setTimeout(()=>speak(assembled(DATA.questions[i],a)),300);return}if(act==='check'){checkAll();return}if(act==='unlock'){const el=$('adultEntry');if(el)el.hidden=false;return}if(act==='grant'){if($('adultCode')?.value==='17931793'){state.grants++;save();render();status('One additional check unlocked.')}else status('Code not accepted.');return}if(act==='clear'){clearTwice();return}if(act==='print'){exportPrint();return}}
const voice=e.target.closest('[data-say]');if(voice){speak(voice.dataset.say);return}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target;if((el.hasAttribute('role')&&el.getAttribute('role')==='button')&&el.dataset.say&&!el.matches('button')){e.preventDefault();speak(el.dataset.say)}});
$('hdrBook').textContent=CFG.meta.bookLabel;$('hdrTitle').textContent=CFG.meta.lessonLabel+' · '+CFG.meta.title;$('hdrBack').textContent=CFG.meta.backLabel;$('hdrBack').href=CFG.meta.backHref;document.title=CFG.meta.title;
render();
</script></body></html>
